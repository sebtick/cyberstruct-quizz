<!DOCTYPE html>
<html lang="fr">
<head>

<title>QCM — Kaspersky Cybersecurity Entry Level | CYBERSTRUCT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f7f4; --surface: #ffffff; --surface2: #f2f1ee;
    --text: #1a1a18; --text-muted: #6b6a66; --text-hint: #9e9d99;
    --border: rgba(0,0,0,0.10); --border-med: rgba(0,0,0,0.18);
    --accent: #185FA5; --accent-bg: #E6F1FB; --accent-text: #0C447C;
    --success-bg: #EAF3DE; --success-border: #639922; --success-text: #27500A;
    --error-bg: #FCEBEB; --error-border: #E24B4A; --error-text: #A32D2D;
    --warn-bg: #FAEEDA; --warn-border: #BA7517; --warn-text: #854F0B;
    --radius: 10px; --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --surface: #252523; --surface2: #2e2e2b;
      --text: #f0ede8; --text-muted: #a09f9a; --text-hint: #6b6a66;
      --border: rgba(255,255,255,0.10); --border-med: rgba(255,255,255,0.18);
      --accent: #4A90D9; --accent-bg: #0C2840; --accent-text: #85B7EB;
      --success-bg: #0e2206; --success-border: #3B6D11; --success-text: #C0DD97;
      --error-bg: #2a0a0a; --error-border: #A32D2D; --error-text: #F09595;
      --warn-bg: #2a1a04; --warn-border: #854F0B; --warn-text: #FAC775;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 16px; line-height: 1.6; }
  .header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
  .header-logo { width: 32px; height: 32px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-logo svg { width: 16px; height: 16px; fill: white; }
  .header-info { flex: 1; }
  .header-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--text-muted); }
  .header-score { font-size: 12px; font-weight: 500; color: var(--accent-text); background: var(--accent-bg); padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .main { max-width: 700px; margin: 0 auto; padding: 20px 16px 60px; }
  .progress-wrap { margin-bottom: 20px; }
  .progress-track { height: 3px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-hint); margin-top: 5px; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; }
  .bloc-badge { display: inline-block; font-size: 11px; font-weight: 500; background: var(--accent-bg); color: var(--accent-text); padding: 3px 10px; border-radius: 20px; margin-bottom: 12px; }
  .question-text { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.55; margin-bottom: 18px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { display: flex; align-items: flex-start; gap: 11px; padding: 11px 14px; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; color: var(--text); line-height: 1.5; transition: background 0.12s, border-color 0.12s, transform 0.08s; width: 100%; font-family: inherit; }
  .option-btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--accent); transform: translateX(2px); }
  .option-btn:disabled { cursor: default; }
  .option-letter { font-size: 11px; font-weight: 500; min-width: 20px; height: 20px; background: var(--surface2); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; color: var(--text-muted); transition: background 0.12s, color 0.12s; }
  .option-btn:hover:not(:disabled) .option-letter { background: var(--accent-bg); color: var(--accent-text); }
  .option-btn.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .option-btn.correct .option-letter { background: var(--success-border); color: white; }
  .option-btn.wrong { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .option-btn.wrong .option-letter { background: var(--error-border); color: white; }
  .option-btn.reveal-correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); opacity: 0.65; }
  .feedback-box { margin-top: 14px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.65; border: 0.5px solid; animation: fadeIn 0.2s ease; }
  .feedback-box.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .feedback-box.wrong { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .feedback-label { font-weight: 500; display: block; margin-bottom: 3px; }
  .nav-row { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn-next { padding: 9px 20px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; transition: background 0.12s; }
  .btn-next:hover { background: var(--surface2); }
  .result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 28px 22px; text-align: center; }
  .result-pct { font-size: 60px; font-weight: 500; color: var(--text); line-height: 1; margin-bottom: 5px; }
  .result-fraction { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; }
  .result-verdict { display: inline-block; font-size: 14px; font-weight: 500; padding: 9px 18px; border-radius: var(--radius-sm); margin-bottom: 24px; border: 0.5px solid; }
  .bloc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 9px; margin-bottom: 18px; text-align: left; }
  .bloc-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .bloc-card-name { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; line-height: 1.4; }
  .bloc-card-score { font-size: 20px; font-weight: 500; color: var(--text); }
  .bloc-card-pct { font-size: 12px; color: var(--text-hint); margin-left: 3px; }
  .threshold-note { font-size: 12px; color: var(--text-hint); margin-bottom: 18px; padding: 7px 11px; background: var(--surface2); border-radius: var(--radius-sm); }
  .btn-restart { padding: 9px 24px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; transition: background 0.12s; }
  .btn-restart:hover { background: var(--surface2); }
  .intro-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 28px 24px; }
  .intro-title { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
  .intro-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.6; }
  .intro-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 9px; margin-bottom: 22px; }
  .intro-stat { background: var(--surface2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .intro-stat-val { font-size: 20px; font-weight: 500; }
  .intro-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .intro-blocs { margin-bottom: 22px; }
  .intro-blocs-title { font-size: 11px; font-weight: 500; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 9px; }
  .intro-bloc-item { display: flex; align-items: center; gap: 9px; font-size: 13px; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .intro-bloc-item:last-child { border-bottom: none; }
  .intro-bloc-num { width: 20px; height: 20px; background: var(--accent-bg); color: var(--accent-text); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; }
  .intro-bloc-q { font-size: 11px; color: var(--text-hint); margin-left: auto; }
  .btn-start { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; transition: opacity 0.12s; }
  .btn-start:hover { opacity: 0.88; }
  .card-anim { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<div class="header" id="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2zm0 2.18l6 2.82v5c0 4.25-2.8 8.18-6 9.3-3.2-1.12-6-5.05-6-9.3V7l6-2.82z"/></svg>
  </div>
  <div class="header-info">
    <div class="header-title">Kaspersky Cybersecurity Entry Level</div>
    <div class="header-sub" id="header-sub">QCM de positionnement — CYBERSTRUCT</div>
  </div>
  <div class="header-score" id="header-score" style="display:none"></div>
</div>

<div class="main" id="app"></div>

<script>
const QUESTIONS = [
  // ─── BLOC 1 — Concepts de base (15 questions) ───
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:1,
    text:"Quelle propriété de la triade CIA garantit que seules les personnes autorisées peuvent accéder à une information ?",
    options:["Disponibilité","Intégrité","Confidentialité","Authenticité"],
    correct:2,
    feedback:"La confidentialité (Confidentiality) restreint l'accès aux données aux seules personnes habilitées. L'intégrité garantit que les données ne sont pas altérées. La disponibilité assure que les systèmes sont accessibles quand on en a besoin."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:2,
    text:"Un hash MD5 d'un fichier change après sa modification. Quel pilier de la sécurité ce mécanisme protège-t-il ?",
    options:["Confidentialité","Disponibilité","Intégrité","Non-répudiation"],
    correct:2,
    feedback:"La vérification d'intégrité via hash (MD5, SHA-256) permet de détecter toute altération d'un fichier. Si le hash calculé diffère du hash d'origine, le fichier a été modifié — volontairement ou non."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:3,
    text:"Une attaque DDoS qui rend un service inaccessible pendant 6 heures porte atteinte à quel pilier de la triade CIA ?",
    options:["Confidentialité","Intégrité","Disponibilité","Authenticité"],
    correct:2,
    feedback:"La disponibilité (Availability) garantit que les systèmes et données sont accessibles aux utilisateurs légitimes quand ils en ont besoin. Une attaque DDoS vise précisément à détruire cette disponibilité."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:4,
    text:"Quelle est la différence entre une menace et une vulnérabilité ?",
    options:[
      "Ce sont des synonymes désignant la même chose.",
      "Une vulnérabilité est une attaque en cours sur un réseau ; une menace est le dommage causé après l'attaque.",
      "Une vulnérabilité est une faiblesse dans un système ; une menace est ce qui pourrait l'exploiter.",
      "Une menace est toujours d'origine humaine ; une vulnérabilité est toujours technique."
    ],
    correct:2,
    feedback:"La vulnérabilité est la faille (ex. : logiciel non patché, mauvaise configuration). La menace est l'élément susceptible d'exploiter cette faille (attaquant, malware, catastrophe naturelle). Le risque combine les deux : probabilité × impact. Ces trois notions sont fondamentales dans toute évaluation de sécurité."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:5,
    text:"Qu'est-ce que l'authentification multi-facteurs (MFA) ?",
    options:[
      "Un mot de passe très long d'au moins 20 caractères.",
      "L'utilisation de deux mots de passe différents pour un même compte.",
      "La combinaison d'au moins deux facteurs de natures différentes pour vérifier une identité.",
      "Un système de reconnexion automatique après 30 minutes d'inactivité."
    ],
    correct:2,
    feedback:"Le MFA combine des facteurs de catégories différentes : ce que je sais (mot de passe, PIN), ce que je possède (téléphone, token), ce que je suis (empreinte, visage). Deux mots de passe appartiennent à la même catégorie et ne constituent pas du MFA."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:6,
    text:"Parmi les propositions suivantes, laquelle constitue un facteur d'authentification de type 'ce que je suis' ?",
    options:["Un code PIN à 4 chiffres","Une clé USB de sécurité","Une reconnaissance de l'iris","Un mot de passe à usage unique (OTP)"],
    correct:2,
    feedback:"La biométrie (empreinte digitale, reconnaissance faciale, iris) correspond au facteur 'ce que je suis'. Le PIN et le mot de passe sont 'ce que je sais'. La clé USB et l'OTP sont 'ce que je possède'."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:7,
    text:"Qu'est-ce qu'un actif (asset) en cybersécurité ?",
    options:[
      "Uniquement les serveurs physiques d'une entreprise.",
      "Toute ressource ayant de la valeur pour une organisation : données, systèmes, logiciels, réputation.",
      "Un outil utilisé par les équipes de sécurité pour détecter les intrusions.",
      "Le budget alloué à la sécurité informatique."
    ],
    correct:1,
    feedback:"Un actif est tout ce qui a de la valeur et qui mérite d'être protégé : données clients, systèmes critiques, propriété intellectuelle, réputation de l'entreprise. La gestion des actifs est le point de départ de toute évaluation des risques."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:8,
    text:"Comment définit-on le risque en cybersécurité ?",
    options:[
      "Le risque est synonyme de menace.",
      "Le risque est la probabilité qu'une vulnérabilité soit exploitée, combinée à l'impact potentiel.",
      "Le risque désigne uniquement les attaques externes à une organisation.",
      "Le risque est le coût total d'un incident de sécurité."
    ],
    correct:1,
    feedback:"Risque = Probabilité × Impact. Un système très vulnérable mais sans valeur représente peu de risque. Un système critique avec peu de vulnérabilités représente un risque modéré. La gestion des risques consiste à réduire cette équation à un niveau acceptable."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:9,
    text:"Qu'est-ce que le principe de la défense en profondeur (defense in depth) ?",
    options:[
      "Investir massivement dans une seule couche de sécurité très solide.",
      "Mettre en place plusieurs couches de sécurité indépendantes, afin que la compromission d'une couche n'entraîne pas la compromission totale.",
      "Former uniquement les administrateurs système aux bonnes pratiques de sécurité.",
      "Sauvegarder les données dans plusieurs datacenters géographiquement distincts."
    ],
    correct:1,
    feedback:"La défense en profondeur empile plusieurs mécanismes de protection (firewall, antivirus, contrôle d'accès, chiffrement, monitoring...). Si une couche est contournée, les autres continuent de protéger. C'est l'approche recommandée par Kaspersky et la plupart des frameworks de sécurité."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:10,
    text:"Qu'est-ce qu'une politique de sécurité informatique ?",
    options:[
      "Un logiciel qui contrôle les accès aux systèmes d'information.",
      "Un ensemble de règles et de procédures définissant comment une organisation gère et protège ses actifs informatiques.",
      "Un rapport d'audit annuel remis à la direction.",
      "Un contrat signé avec un prestataire de cybersécurité."
    ],
    correct:1,
    feedback:"La politique de sécurité est un document formel qui établit les règles de comportement, les responsabilités et les procédures relatives à la sécurité de l'information. Elle est la base de toute démarche de sécurité organisationnelle."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:11,
    text:"Parmi ces exemples, lequel représente une menace interne (insider threat) ?",
    options:[
      "Un groupe de hackers qui lance une attaque DDoS depuis l'étranger.",
      "Un employé mécontent qui copie des données confidentielles sur une clé USB avant de quitter l'entreprise.",
      "Un malware qui s'infiltre via une pièce jointe email.",
      "Un bot qui tente des connexions par force brute sur un portail web."
    ],
    correct:1,
    feedback:"Les menaces internes proviennent de personnes ayant un accès légitime aux systèmes : employés, prestataires, anciens collaborateurs. Elles sont particulièrement dangereuses car difficiles à détecter et souvent sous-estimées par les organisations."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:12,
    text:"Qu'est-ce que la non-répudiation en sécurité de l'information ?",
    options:[
      "La capacité à chiffrer les communications pour éviter leur interception.",
      "La garantie qu'une action ou une transaction ne peut être niée par son auteur.",
      "Le processus d'effacement sécurisé des données sensibles.",
      "Un mécanisme empêchant les utilisateurs de modifier leurs propres fichiers."
    ],
    correct:1,
    feedback:"La non-répudiation garantit qu'un utilisateur ne peut pas nier avoir effectué une action (envoi d'un email, signature d'un document, connexion à un système). Elle est assurée par des mécanismes comme la signature numérique et les journaux d'audit."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:13,
    text:"Un utilisateur utilise le même mot de passe pour son email professionnel, son compte LinkedIn et sa banque en ligne. Quel risque cela représente-t-il ?",
    options:[
      "Aucun risque particulier si le mot de passe est suffisamment long.",
      "Si l'un des services est compromis, l'attaquant peut accéder à tous les autres comptes (credential stuffing).",
      "Le risque est limité tant que l'utilisateur change son mot de passe une fois par an.",
      "Ce n'est un risque que pour les comptes sur des sites non-HTTPS."
    ],
    correct:1,
    feedback:"La réutilisation de mots de passe expose à l'attaque par credential stuffing : les attaquants testent automatiquement des couples login/mot de passe volés sur des milliers de services. Un seul service compromis suffit à exposer tous les autres."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:14,
    text:"Qu'est-ce qu'un gestionnaire de mots de passe (password manager) ?",
    options:[
      "Un fichier Excel protégé par mot de passe contenant tous ses identifiants.",
      "Un outil qui génère, stocke et remplit automatiquement des mots de passe uniques et complexes pour chaque service.",
      "Un service proposé par le navigateur web pour mémoriser les mots de passe en clair.",
      "Un système d'entreprise qui impose des règles de complexité aux mots de passe."
    ],
    correct:1,
    feedback:"Un gestionnaire de mots de passe (Bitwarden, 1Password, KeePass...) stocke les mots de passe chiffrés et en génère des uniques pour chaque service. L'utilisateur ne retient qu'un seul mot de passe maître. C'est la bonne pratique recommandée par Kaspersky."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:15,
    text:"Qu'appelle-t-on la surface d'attaque (attack surface) d'une organisation ?",
    options:[
      "Le nombre total de cyberattaques subies par an.",
      "L'ensemble des points d'entrée potentiels qu'un attaquant peut exploiter pour compromettre un système.",
      "La superficie physique des locaux contenant les serveurs.",
      "Le budget disponible pour les tests d'intrusion."
    ],
    correct:1,
    feedback:"La surface d'attaque englobe tous les vecteurs d'entrée potentiels : ports réseau ouverts, applications web, endpoints non patchés, comptes utilisateurs, APIs exposées... Réduire la surface d'attaque (hardening) est l'un des principes fondamentaux de la sécurité."
  },

  // ─── BLOC 2 — Outils des attaquants & types d'attaques (15 questions) ───
  {
    bloc:"Bloc 2 — Outils des attaquants", blocIdx:1, num:16,
    text:"Quel type de malware se propage automatiquement de machine en machine sans intervention humaine ?",
    options:["Un trojan (cheval de Troie)","Un ver (worm)","Un ransomware","Un adware"],
    correct:1,
    feedback:"Un ver se propage de façon autonome en exploitant des vulnérabilités réseau, sans avoir besoin d'être attaché à un fichier ni d'une action utilisateur. WannaCry (2017) était un ransomware combiné à un ver qui s'est propagé massivement via EternalBlue."
  },
  {
    bloc:"Bloc 2 — Outils des attaquants", blocIdx:1, num:17,
    text:"Un cheval de Troie (trojan) se distingue d'un virus classique car il :",
    options:[
      "Se réplique automatiquement sur tous les systèmes du réseau.",
      "Se présente comme un logiciel légitime pour tromper l'utilisateur et l'amener à l'exécuter.",
      "Chiffre uniquement les fichiers système et non les documents personnels.",
      "S'attaque exclusivement aux systèmes Windows."
    ],
    correct:1,
    feedback:"Le trojan se déguise en application légitime (jeu, outil gratuit, mise à jour...) pour être installé volontairement par l'utilisateur. Une fois en place, il ouvre une backdoor, vole des données ou télécharge d'autres malwares. Il ne se réplique pas seul — c'est sa principale différence avec un ver."
  },
  {
    bloc:"Bloc 2 — Outils des attaquants", blocIdx:1, num:18,
    text:"Qu'est-ce qu'un botnet ?",
    options:[
      "Un réseau dédié à la cybersécurité utilisé par les chercheurs.",
      "Un ensemble de machines infectées et contrôlées à distance par un attaquant.",
      "Un logiciel de surveillance réseau utilisé par les administrateurs.",
      "Un protocole de communication sécurisé entre serveurs."
    ],
    correct:1,
    feedback:"Un botnet est un réseau de machines compromises (bots ou zombies) contrôlées via un serveur de commande & contrôle (C2). Les botnets servent à lancer des DDoS, envoyer du spam, miner des cryptomonnaies ou distribuer des malwares, souvent à l'insu des propriétaires des machines."
  },
  {
    bloc:"Bloc 2 — Outils des attaquants", blocIdx:1, num:19,
    text:"Quelle est la technique employée par le ransomware pour rendre les fichiers inaccessibles ?",
    options:["Il supprime définitivement les fichiers.","Il chiffre les fichiers avec une clé que seul l'attaquant possède.","Il déplace les fichiers vers un serveur distant contrôlé par l'attaquant.","Il corrompt le système de fichiers pour empêcher le démarrage de l'OS."],
    correct:1,

    feedback:"Les objets IoT (caméras, thermostats, capteurs industriels...) tournent souvent sur des firmware non patchés, avec des identifiants par défaut, sans chiffrement. Ils élargissent massivement la surface d'attaque. Des millions d'appareils IoT ont été recrutés dans des botnets (ex. Mirai en 2016)."
  },
  {
    bloc:"Bloc 4 — Futur de la cybersécurité", blocIdx:3, num:49,
    text:"Qu'est-ce que la cryptographie post-quantique et pourquoi est-elle importante ?",
    options:[
      "Une technique de chiffrement utilisant des ordinateurs quantiques pour accélérer le chiffrement actuel.",
      "De nouveaux algorithmes de chiffrement résistants aux ordinateurs quantiques, qui pourraient sinon briser les algorithmes actuels (RSA, ECC).",
      "Un protocole de sécurité spécialement conçu pour les communications spatiales.",
      "Une méthode de chiffrement utilisée uniquement par les États pour leurs communications diplomatiques."
    ],
    correct:1,
    feedback:"Les ordinateurs quantiques, via l'algorithme de Shor, pourront théoriquement casser RSA et ECC. Le NIST a standardisé en 2024 les premiers algorithmes post-quantiques (CRYSTALS-Kyber, CRYSTALS-Dilithium). Les organisations doivent anticiper cette transition, car des données volées aujourd'hui pourraient être déchiffrées demain."
  },
  {
    bloc:"Bloc 4 — Futur de la cybersécurité", blocIdx:3, num:50,
    text:"Qu'est-ce que le concept de 'Security by Design' ?",
    options:[
      "Recruter des experts en sécurité au sein des équipes de design graphique.",
      "Intégrer la sécurité dès la conception d'un système ou d'une application, plutôt que de l'ajouter après coup.",
      "Concevoir des interfaces utilisateur intuitives pour les outils de sécurité.",
      "Un standard de certification ISO pour les logiciels sécurisés."
    ],
    correct:1,
    feedback:"Security by Design (et Privacy by Design pour les données personnelles) intègre les exigences de sécurité dès les premières phases de développement. Corriger une faille en production coûte 30 à 100 fois plus cher que de la prévenir dès la conception. C'est l'approche recommandée dans le contexte DevSecOps."
  },

  // ─── QUESTIONS COMPLÉMENTAIRES — Notions manquantes du programme Kaspersky ───
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:51,
    text:"Qu'est-ce que la règle de sauvegarde 3-2-1 ?",
    options:[
      "Sauvegarder ses données 3 fois par jour, 2 fois par semaine et 1 fois par mois.",
      "Conserver 3 copies des données sur 2 supports différents, dont 1 copie hors site (ou dans le cloud).",
      "Utiliser 3 logiciels de sauvegarde différents, sur 2 systèmes d'exploitation, avec 1 chiffrement.",
      "Réaliser une sauvegarde complète toutes les 3 heures avec une rétention de 21 jours."
    ],
    correct:1,
    feedback:"La règle 3-2-1 est la bonne pratique de référence en matière de sauvegarde : 3 copies des données (originale + 2 sauvegardes), sur 2 supports différents (disque local + NAS par exemple), dont 1 copie stockée hors site ou dans le cloud. Cette stratégie protège contre les pannes matérielles, les ransomwares et les sinistres physiques."
  },
  {
    bloc:"Bloc 1 — Concepts de base", blocIdx:0, num:52,
    text:"Parmi ces comportements, lequel constitue une bonne pratique d'hygiène numérique au quotidien ?",
    options:[
      "Utiliser le même mot de passe simple sur tous ses comptes pour ne pas l'oublier.",
      "Télécharger des logiciels depuis n'importe quel site proposant la version gratuite.",
      "Maintenir ses applications et son système d'exploitation à jour, activer le MFA et utiliser un mot de passe unique par service.",
      "Désactiver les mises à jour automatiques pour éviter les interruptions de travail."
    ],
    correct:2,
    feedback:"L'hygiène numérique repose sur des réflexes simples mais essentiels : mises à jour régulières (correction des vulnérabilités), MFA activé (protection des comptes), mots de passe uniques (éviter le credential stuffing), et téléchargements depuis des sources officielles uniquement. Kaspersky insiste sur ces pratiques dans le module vie quotidienne du cours."
  },
  {
    bloc:"Bloc 2 — Outils des attaquants", blocIdx:1, num:53,
    text:"Vous êtes dans un café et vous utilisez le Wi-Fi public gratuit pour consulter votre email professionnel. Quel est le risque principal ?",
    options:[
      "Votre batterie se décharge plus vite sur un réseau Wi-Fi public.",
      "Un attaquant présent sur le même réseau peut intercepter vos communications non chiffrées (attaque MitM).",
      "Les sites web se chargent plus lentement, ce qui augmente le risque d'erreur humaine.",
      "Le Wi-Fi public n'est dangereux que si vous visitez des sites sans cadenas HTTPS."
    ],
    correct:1,
    feedback:"Les réseaux Wi-Fi publics non sécurisés sont des terrains de chasse privilégiés pour les attaques Man-in-the-Middle. Un attaquant peut créer un faux point d'accès (evil twin) ou écouter le trafic non chiffré. La bonne pratique : utiliser un VPN sur tout réseau Wi-Fi public, et vérifier que les sites visités sont bien en HTTPS."
  },
  {
    bloc:"Bloc 4 — Futur de la cybersécurité", blocIdx:3, num:54,
    text:"Parmi les métiers suivants, lequel correspond au rôle d'un analyste SOC (Security Operations Center) ?",
    options:[
      "Développer de nouvelles applications web sécurisées pour l'entreprise.",
      "Surveiller les alertes de sécurité en temps réel, investiguer les incidents et coordonner la réponse aux menaces.",
      "Auditer la conformité RGPD des traitements de données personnelles de l'entreprise.",
      "Concevoir l'architecture réseau et les règles de pare-feu de l'organisation."
    ],
    correct:1,
    feedback:"L'analyste SOC (niveaux L1/L2/L3) surveille les tableaux de bord SIEM, trie et qualifie les alertes, investigate les incidents et escalade si nécessaire. Il se distingue du pentester (offensif), du DPO (conformité RGPD) et de l'architecte réseau. Le cours Kaspersky Entry Level inclut un module dédié aux carrières en cybersécurité pour aider les étudiants à se projeter."
  }
];

const BLOC_NAMES = ["Concepts de base","Outils des attaquants","Domaines de la cybersécurité","Futur de la cybersécurité"];
const BLOC_TOTALS = [17, 16, 15, 6];
const LETTERS = ['A','B','C','D'];

let state = { screen:'intro', current:0, score:0, answered:false, blocScores:[0,0,0,0] };

function pct(s,t){ return t===0?0:Math.round((s/t)*100); }

function updateHeader(){
  const hScore=document.getElementById('header-score');
  const hSub=document.getElementById('header-sub');
  if(state.screen==='question'){
    hScore.style.display='block';
    hScore.textContent=state.score+' / '+state.current+' correctes';
  } else {
    hScore.style.display='none';
  }
  hSub.textContent = state.screen==='result' ? 'Résultats' : 'QCM de positionnement — CYBERSTRUCT';
}

function renderIntro(){
  state.screen='intro'; updateHeader();
  document.getElementById('app').innerHTML=`
    <div class="intro-card card-anim">
      <div class="intro-title">QCM Kaspersky Cybersecurity Entry Level</div>
      <div class="intro-sub">54 questions couvrant l'intégralité des 4 blocs thématiques du cours officiel Kaspersky, incluant les notions d'hygiène numérique, sauvegarde, Wi-Fi public et métiers cyber. Chaque réponse est accompagnée d'une explication détaillée. Le seuil de passage Kaspersky est fixé à 70%.</div>
      <div class="intro-stats">
        <div class="intro-stat"><div class="intro-stat-val">54</div><div class="intro-stat-label">questions</div></div>
        <div class="intro-stat"><div class="intro-stat-val">70%</div><div class="intro-stat-label">seuil de passage</div></div>
        <div class="intro-stat"><div class="intro-stat-val">~45 min</div><div class="intro-stat-label">durée estimée</div></div>
      </div>
      <div class="intro-blocs">
        <div class="intro-blocs-title">Contenu du QCM</div>
        <div class="intro-bloc-item"><div class="intro-bloc-num">1</div><span>Concepts de base (CIA, risques, MFA, hygiène numérique, sauvegarde 3-2-1...)</span><span class="intro-bloc-q">17 questions</span></div>
        <div class="intro-bloc-item"><div class="intro-bloc-num">2</div><span>Outils des attaquants et types de cyberattaques (Wi-Fi, phishing, APT...)</span><span class="intro-bloc-q">16 questions</span></div>
        <div class="intro-bloc-item"><div class="intro-bloc-num">3</div><span>Domaines de la cybersécurité (SOC, crypto, IAM, forensique, RGPD...)</span><span class="intro-bloc-q">15 questions</span></div>
        <div class="intro-bloc-item"><div class="intro-bloc-num">4</div><span>Futur de la cybersécurité (Zero Trust, IA, IoT, métiers cyber...)</span><span class="intro-bloc-q">6 questions</span></div>
      </div>
      <button class="btn-start" onclick="startQuiz()">Commencer le QCM</button>
    </div>`;
}

function startQuiz(){
  state={screen:'question',current:0,score:0,answered:false,blocScores:[0,0,0,0]};
  renderQuestion();
}

function renderQuestion(){
  state.screen='question'; state.answered=false; updateHeader();
  const q=QUESTIONS[state.current];
  const prog=Math.round((state.current/QUESTIONS.length)*100);
  document.getElementById('app').innerHTML=`
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
      <div class="progress-labels"><span>Question ${q.num} / ${QUESTIONS.length}</span><span>${prog}% complété</span></div>
    </div>
    <div class="card card-anim">
      <div class="bloc-badge">${q.bloc}</div>
      <div class="question-text">${q.text}</div>
      <div class="options" id="options">
        ${q.options.map((o,i)=>`<button class="option-btn" onclick="handleAnswer(${i})"><span class="option-letter">${LETTERS[i]}</span><span>${o}</span></button>`).join('')}
      </div>
      <div id="feedback-area"></div>
      <div class="nav-row" id="nav-row" style="display:none">
        <button class="btn-next" onclick="nextQuestion()">${state.current<QUESTIONS.length-1?'Question suivante →':'Voir mes résultats →'}</button>
      </div>
    </div>`;
}

function handleAnswer(idx){
  if(state.answered) return;
  state.answered=true;
  const q=QUESTIONS[state.current];
  const ok=idx===q.correct;
  if(ok){state.score++;state.blocScores[q.blocIdx]++;}
  document.querySelectorAll('.option-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===idx&&ok) b.classList.add('correct');
    if(i===idx&&!ok) b.classList.add('wrong');
    if(i===q.correct&&!ok) b.classList.add('reveal-correct');
  });
  document.getElementById('feedback-area').innerHTML=`
    <div class="feedback-box ${ok?'correct':'wrong'}">
      <span class="feedback-label">${ok?'✓ Bonne réponse':'✗ Mauvaise réponse'}</span>${q.feedback}
    </div>`;
  document.getElementById('nav-row').style.display='flex';
  updateHeader();
}

function nextQuestion(){
  state.current++;
  if(state.current>=QUESTIONS.length) renderResult();
  else renderQuestion();
}

function renderResult(){
  state.screen='result'; updateHeader();
  const p=pct(state.score,QUESTIONS.length);
  let vt,vs;
  if(p>=80){vt='Excellent — tu es prêt(e) pour la certification Kaspersky !';vs=`background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);`;}
  else if(p>=70){vt='Tu franchis le seuil (70%) — quelques révisions pour consolider.';vs=`background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text);`;}
  else{vt='En dessous du seuil (70%) — reprendre les modules du cours Kaspersky.';vs=`background:var(--error-bg);border-color:var(--error-border);color:var(--error-text);`;}
  const bc=BLOC_NAMES.map((n,i)=>`<div class="bloc-card"><div class="bloc-card-name">${n}</div><div class="bloc-card-score">${state.blocScores[i]}/${BLOC_TOTALS[i]}<span class="bloc-card-pct">(${pct(state.blocScores[i],BLOC_TOTALS[i])}%)</span></div></div>`).join('');
  document.getElementById('app').innerHTML=`
    <div class="result-card card-anim">
      <div class="result-pct">${p}%</div>
      <div class="result-fraction">${state.score} bonnes réponses sur ${QUESTIONS.length}</div>
      <div class="result-verdict" style="${vs}">${vt}</div>
      <div class="bloc-grid">${bc}</div>
      <div class="threshold-note">Seuil de passage officiel Kaspersky : 70% — soit 38/54 dans ce QCM</div>
      <button class="btn-restart" onclick="restart()">Recommencer le QCM</button>
    </div>`;
}

function restart(){
  state={screen:'intro',current:0,score:0,answered:false,blocScores:[0,0,0,0]};
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
