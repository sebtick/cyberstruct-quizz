<style>

    --error-bg: #FCEBEB; --error-border: #E24B4A; --error-text: #A32D2D;
    --warn-bg: #FAEEDA; --warn-border: #BA7517; --warn-text: #854F0B;

    :root {
      --bg: #1c1c1a; --surface: #252523; --surface2: #2e2e2b;
      --text: #f0ede8; --text-muted: #a09f9a; --text-hint: #6b6a66;
      --border: rgba(255,255,255,0.10); --border-med: rgba(255,255,255,0.18);
      --accent: #76B900; --accent-bg: #1A2D00; --accent-text: #A8E050;
      --success-bg: #0e2206; --success-border: #3B6D11; --success-text: #C0DD97;
      --error-bg: #2a0a0a; --error-border: #A32D2D; --error-text: #F09595;
      --warn-bg: #2a1a04; --warn-border: #854F0B; --warn-text: #FAC775;

  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }
  .header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }

  .header-info { flex: 1; min-width: 0; }
  .header-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .header-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-score { font-size: 12px; font-weight: 500; color: var(--accent-text); background: var(--accent-bg); padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .progress-wrap { margin-bottom: 18px; }

  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-hint); margin-top: 5px; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .bloc-badge { display: inline-block; font-size: 11px; font-weight: 500; background: var(--accent-bg); color: var(--accent-text); padding: 3px 10px; border-radius: 20px; margin-bottom: 12px; }
  .question-text { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.55; margin-bottom: 14px; }
  .code-block { background: var(--code-bg); color: var(--code-text); font-family: 'SF Mono','Fira Code','Consolas',monospace; font-size: 12px; line-height: 1.7; padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 14px; overflow-x: auto; white-space: pre; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { display: flex; align-items: flex-start; gap: 11px; padding: 11px 14px; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; color: var(--text); line-height: 1.5; transition: background 0.12s, border-color 0.12s, transform 0.08s; width: 100%; font-family: inherit; }
  .option-btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--accent); transform: translateX(2px); }
  .option-btn:disabled { cursor: default; }
  .option-letter { font-size: 11px; font-weight: 500; min-width: 20px; height: 20px; background: var(--surface2); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; color: var(--text-muted); }
  .option-btn:hover:not(:disabled) .option-letter { background: var(--accent-bg); color: var(--accent-text); }
  .option-btn.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .option-btn.correct .option-letter { background: var(--success-border); color: white; }
  .option-btn.wrong { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .option-btn.wrong .option-letter { background: var(--error-border); color: white; }
  .option-btn.reveal-correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); opacity: 0.65; }
  .feedback-box { margin-top: 14px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.65; border: 0.5px solid; animation: fadeIn 0.2s ease; }
  .feedback-box.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .feedback-box.wrong { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .feedback-label { font-weight: 500; display: block; margin-bottom: 3px; }
  .nav-row { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn-next { padding: 9px 20px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; transition: background 0.12s; }
  .btn-next:hover { background: var(--surface2); }
  .result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 28px 22px; text-align: center; }
  .result-pct { font-size: 58px; font-weight: 500; color: var(--text); line-height: 1; margin-bottom: 5px; }
  .result-fraction { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; }
  .result-verdict { display: inline-block; font-size: 14px; font-weight: 500; padding: 9px 18px; border-radius: var(--radius-sm); margin-bottom: 24px; border: 0.5px solid; }
  .bloc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; margin-bottom: 18px; text-align: left; }
  .bloc-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .bloc-card-name { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; line-height: 1.4; }
  .bloc-card-score { font-size: 20px; font-weight: 500; color: var(--text); }
  .bloc-card-pct { font-size: 12px; color: var(--text-hint); margin-left: 3px; }
  .threshold-note { font-size: 12px; color: var(--text-hint); margin-bottom: 18px; padding: 7px 11px; background: var(--surface2); border-radius: var(--radius-sm); }
  .btn-restart { padding: 9px 24px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; }
  .btn-restart:hover { background: var(--surface2); }
  .intro-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 28px 24px; }
  .intro-title { font-size: 20px; font-weight: 500; margin-bottom: 6px; }
  .intro-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
  .intro-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .intro-stat { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .intro-stat-val { font-size: 19px; font-weight: 500; }
  .intro-stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .intro-blocs { margin-bottom: 22px; }
  .intro-blocs-title { font-size: 11px; font-weight: 500; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .intro-bloc-item { display: flex; align-items: center; gap: 9px; font-size: 12px; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .intro-bloc-item:last-child { border-bottom: none; }
  .intro-bloc-num { width: 20px; height: 20px; background: var(--accent-bg); color: var(--accent-text); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; }
  .intro-bloc-q { font-size: 10px; color: var(--text-hint); margin-left: auto; }
  .btn-start { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; background: var(--accent); color: #1a1a18; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; transition: opacity 0.12s; font-weight: 600; }
  .btn-start:hover { opacity: 0.88; }
  .card-anim { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>

<body>
<div class="header" id="header">
  <div class="header-logo">NV</div>
  <div class="header-info">
    <div class="header-title">NVIDIA DLI — Fundamentals of Deep Learning</div>
    <div class="header-sub" id="header-sub">QCM de positionnement — CYBERSTRUCT</div>
  </div>
  <div class="header-score" id="header-score" style="display:none"></div>

<div class="main" id="app"></div>

<script>
const Q = [
// ═══════════════════════════════════════════════════
// BLOC 1 — Mécaniques du Deep Learning (14 questions)
// ═══════════════════════════════════════════════════
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:1,
text:"Quelle est la différence fondamentale entre le Machine Learning traditionnel et le Deep Learning ?",
code:null,
opts:["Le Deep Learning nécessite toujours plus de données que le ML traditionnel.","Le Deep Learning apprend automatiquement des représentations hiérarchiques à partir des données brutes, sans extraction manuelle de features ; le ML traditionnel requiert une feature engineering manuelle.","Le Deep Learning est uniquement applicable aux images ; le ML traditionnel s'applique à tous types de données.","Le Deep Learning est plus rapide à entraîner que les modèles ML classiques."],
ok:1,
fb:"Le Deep Learning apprend automatiquement des représentations (features) à partir des données brutes grâce aux couches successives du réseau neuronal : pixels → contours → formes → objets. Le ML traditionnel (SVM, Random Forest...) nécessite une extraction manuelle de features par des experts du domaine. C'est la notion clé introduite dès la première heure du cours NVIDIA DLI."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:2,
text:"Qu'est-ce qu'un neurone artificiel et comment calcule-t-il sa sortie ?",
code:null,
opts:["Un neurone calcule la moyenne pondérée de ses entrées, sans aucune transformation.","Un neurone calcule une somme pondérée de ses entrées, y ajoute un biais, puis applique une fonction d'activation pour produire sa sortie.","Un neurone sélectionne la valeur maximale parmi ses entrées et la transmet à la couche suivante.","Un neurone calcule le produit de ses entrées et applique une normalisation."],
ok:1,
fb:"Un neurone artificiel : 1) calcule la somme pondérée de ses entrées (Σ wᵢxᵢ), 2) ajoute un biais (b), 3) applique une fonction d'activation f(). Sortie = f(Σwᵢxᵢ + b). Les poids (w) et le biais (b) sont les paramètres appris pendant l'entraînement. La fonction d'activation introduit la non-linéarité — sans elle, plusieurs couches équivaudraient à une seule transformation linéaire."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:3,
text:"Quel est le rôle de la fonction de perte (loss function) dans l'entraînement d'un réseau de neurones ?",
code:null,
opts:["La fonction de perte génère les données d'entraînement pour le modèle.","La fonction de perte mesure l'écart entre les prédictions du modèle et les vraies valeurs — elle guide l'optimisation en indiquant dans quelle direction ajuster les poids.","La fonction de perte normalise les activations entre les couches pour accélérer la convergence.","La fonction de perte sélectionne automatiquement l'architecture optimale du réseau."],
ok:1,
fb:"La loss function quantifie l'erreur du modèle. Exemples : MSE (Mean Squared Error) pour la régression, Cross-Entropy pour la classification. L'objectif de l'entraînement est de minimiser cette perte. Le gradient de la perte par rapport à chaque poids est calculé par rétropropagation (backpropagation) et utilisé par l'optimiseur pour mettre à jour les poids."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:4,
text:"Qu'est-ce que la descente de gradient (gradient descent) et comment est-elle utilisée dans l'entraînement ?",
code:null,
opts:["La descente de gradient est une technique de visualisation des performances d'un modèle au fil des epochs.","La descente de gradient est un algorithme d'optimisation qui met à jour les poids du réseau dans la direction opposée au gradient de la perte pour minimiser l'erreur.","La descente de gradient est un algorithme de sélection des hyperparamètres optimaux du réseau.","La descente de gradient est utilisée uniquement pour la classification binaire."],
ok:1,
fb:"La descente de gradient : w = w - α × ∂L/∂w où α est le taux d'apprentissage (learning rate) et ∂L/∂w est le gradient de la perte par rapport au poids. On 'descend' dans le paysage de la perte vers un minimum. SGD (Stochastic Gradient Descent) utilise des mini-batches. Adam (Adaptive Moment Estimation) est l'optimiseur le plus utilisé en pratique — il adapte le learning rate individuellement pour chaque paramètre."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:5,
text:"Analysez ce code Keras. Que fait la couche 'Dense(512, activation=\"relu\")' ?",
code:'model = Sequential([\n    Dense(512, activation="relu", input_shape=(784,)),\n    Dense(10, activation="softmax")\n])',
opts:["Elle crée une couche de 512 neurones avec une activation linéaire et 784 connexions d'entrée.","Elle crée une couche entièrement connectée de 512 neurones avec la fonction d'activation ReLU, chaque neurone connecté à toutes les entrées.","Elle crée un filtre convolutionnel de taille 512×512 avec ReLU.","Elle crée une couche de pooling qui réduit la dimension à 512."],
ok:1,
fb:"Dense(512, activation='relu') crée une couche entièrement connectée (fully connected / feedforward) avec 512 neurones. Chaque neurone reçoit toutes les entrées (784 dans ce cas), calcule sa somme pondérée + biais, puis applique ReLU (max(0, x)). ReLU (Rectified Linear Unit) est la fonction d'activation la plus utilisée dans les couches cachées — elle résout le problème de vanishing gradient et est simple à calculer."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:6,
text:"Quelle est la fonction d'activation appropriée pour la couche de sortie d'un problème de classification multiclasse ?",
code:null,
opts:["ReLU — car elle donne des valeurs positives pour toutes les classes.","Sigmoid — car elle donne des probabilités entre 0 et 1.","Softmax — car elle produit une distribution de probabilités sur toutes les classes dont la somme vaut 1.","Tanh — car elle centre les sorties autour de zéro."],
ok:2,
fb:"Softmax transforme un vecteur de scores bruts (logits) en distribution de probabilités : P(classe_i) = exp(zᵢ) / Σexp(zⱼ). La somme des probabilités vaut toujours 1. Pour la classification binaire, Sigmoid suffit (une seule sortie). Pour la régression, on utilise souvent une activation linéaire (pas d'activation) ou ReLU. Dans le code ci-dessus, Dense(10, activation='softmax') produit 10 probabilités (une par classe MNIST)."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:7,
text:"Qu'est-ce qu'une epoch dans le contexte de l'entraînement d'un modèle de deep learning ?",
code:null,
opts:["Une epoch correspond à une mise à jour des poids (un batch).","Une epoch correspond à un passage complet de toutes les données d'entraînement dans le réseau, en avant puis en arrière.","Une epoch correspond à 1000 itérations de l'optimiseur.","Une epoch est la phase d'évaluation du modèle sur le jeu de test."],
ok:1,
fb:"Une epoch = un passage complet du dataset d'entraînement à travers le réseau (forward pass + backpropagation pour chaque batch). Si on a 60 000 images et un batch_size=128, une epoch = 60000/128 ≈ 469 mises à jour des poids. L'entraînement se fait sur plusieurs dizaines à centaines d'epochs. model.fit(X_train, y_train, epochs=20, batch_size=128) dans Keras."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:8,
text:"Qu'est-ce que le surapprentissage (overfitting) et comment se manifeste-t-il ?",
code:null,
opts:["L'overfitting se produit quand le modèle converge trop lentement pendant l'entraînement.","L'overfitting se produit quand le modèle mémorise les données d'entraînement au lieu de généraliser — il a une excellente précision sur le train mais une mauvaise précision sur le test/validation.","L'overfitting se produit quand le learning rate est trop élevé et que la loss diverge.","L'overfitting se produit uniquement avec les réseaux convolutionnels, pas avec les réseaux denses."],
ok:1,
fb:"L'overfitting : train accuracy élevée, val accuracy basse → le modèle a mémorisé les exemples d'entraînement (bruit inclus) mais ne généralise pas. Symptôme classique : la loss de validation remonte après quelques epochs alors que la loss d'entraînement continue de baisser. Solutions : dropout, data augmentation, L2 regularization, early stopping, réduction de la complexité du modèle."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:9,
text:"Que fait le Dropout dans un réseau de neurones et pourquoi est-il utilisé ?",
code:'model.add(Dense(512, activation="relu"))\nmodel.add(Dropout(0.5))',
opts:["Le Dropout supprime définitivement 50% des neurones les moins performants pendant l'entraînement.","Le Dropout désactive aléatoirement 50% des neurones à chaque forward pass pendant l'entraînement, forçant le réseau à apprendre des représentations redondantes et robustes.","Le Dropout réduit la taille du réseau de 50% pour accélérer l'inférence.","Le Dropout normalise les activations pour maintenir une distribution stable pendant l'entraînement."],
ok:1,
fb:"Dropout(0.5) désactive aléatoirement 50% des neurones à chaque forward pass pendant l'entraînement (en les mettant à zéro). Cela force le réseau à ne pas dépendre d'un sous-ensemble de neurones spécifiques — il doit apprendre des représentations distribuées et robustes. Pendant l'inférence, tous les neurones sont actifs mais leurs sorties sont multipliées par (1 - dropout_rate). C'est une technique de régularisation très efficace contre l'overfitting."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:10,
text:"Comment interpréter ces courbes d'apprentissage ?",
code:"Epoch 1/20 — loss: 0.95, val_loss: 0.92\nEpoch 5/20 — loss: 0.42, val_loss: 0.45\nEpoch 10/20 — loss: 0.21, val_loss: 0.38\nEpoch 15/20 — loss: 0.08, val_loss: 0.61\nEpoch 20/20 — loss: 0.03, val_loss: 0.89",
opts:["Le modèle converge correctement — la loss train et val diminuent ensemble.","Le modèle souffre d'underfitting — les deux losses restent trop élevées.","Le modèle souffre d'overfitting — la loss d'entraînement continue de baisser mais la val_loss remonte à partir de l'epoch 10.","Le learning rate est trop élevé — la loss oscille sans converger."],
ok:2,
fb:"C'est un cas classique d'overfitting : jusqu'à l'epoch 10, train et val convergent ensemble (c'est la zone saine). À partir de l'epoch 10, train_loss continue de baisser (0.08 → 0.03) mais val_loss remonte (0.38 → 0.89) — le modèle mémorise le jeu d'entraînement. Solution idéale : Early Stopping à l'epoch 10 (callbacks dans Keras), ou data augmentation, ou Dropout. L'epoch optimale est autour de 10."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:11,
text:"Quel est le rôle du taux d'apprentissage (learning rate) dans l'entraînement ?",
code:null,
opts:["Le learning rate définit la proportion du dataset utilisée pour l'entraînement vs la validation.","Le learning rate contrôle la taille des mises à jour des poids à chaque étape d'optimisation — trop élevé : divergence ; trop faible : convergence lente ou blocage dans un minimum local.","Le learning rate définit le nombre de couches cachées du réseau.","Le learning rate est un paramètre fixe calculé automatiquement par Keras — il n'est pas réglable."],
ok:1,
fb:"Le learning rate (α) est l'hyperparamètre le plus critique : trop élevé → la loss oscille ou diverge (les mises à jour sont trop grandes et on 'saute' le minimum). Trop faible → l'entraînement est très lent et peut rester bloqué dans un minimum local. Adam utilise un learning rate adaptatif (typiquement 1e-3 par défaut). Un learning rate scheduler peut réduire progressivement α au cours de l'entraînement."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:12,
text:"Qu'est-ce que la rétropropagation (backpropagation) ?",
code:null,
opts:["La rétropropagation est la phase d'inférence où le modèle produit des prédictions sur de nouvelles données.","La rétropropagation est l'algorithme qui calcule les gradients de la perte par rapport à chaque poids du réseau en appliquant la règle de la chaîne (chain rule), de la couche de sortie vers les couches d'entrée.","La rétropropagation est un processus d'augmentation des données qui rétrograde les images pour créer de nouvelles variantes.","La rétropropagation est l'initialisation aléatoire des poids du réseau avant l'entraînement."],
ok:1,
fb:"Backpropagation = calcul efficace des gradients via la règle de la chaîne de dérivation composée. On calcule d'abord l'erreur en sortie (forward pass), puis on propage l'erreur couche par couche vers l'entrée pour calculer ∂L/∂w pour chaque poids. Ces gradients sont ensuite utilisés par l'optimiseur (Adam, SGD) pour mettre à jour les poids. C'est l'algorithme fondamental qui rend l'entraînement des réseaux profonds possible."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:13,
text:"Que fait model.compile() dans Keras et quels paramètres sont essentiels ?",
code:'model.compile(\n    optimizer="adam",\n    loss="categorical_crossentropy",\n    metrics=["accuracy"]\n)',
opts:["model.compile() entraîne le modèle sur les données en configurant l'optimiseur et la loss.","model.compile() configure le modèle pour l'entraînement : définit l'optimiseur (algorithme d'optimisation), la loss function (métrique à minimiser), et les métriques à surveiller — sans lancer l'entraînement.","model.compile() sauvegarde les poids initiaux du modèle avant l'entraînement.","model.compile() teste automatiquement plusieurs optimiseurs pour sélectionner le meilleur."],
ok:1,
fb:"model.compile() prépare le modèle pour l'entraînement sans le lancer. Les trois paramètres clés : optimizer (Adam, SGD, RMSprop...), loss (categorical_crossentropy pour multiclasse, binary_crossentropy pour binaire, mse pour régression), metrics (accuracy, etc. — pour le monitoring, pas pour l'optimisation). L'entraînement réel est lancé par model.fit(). model.evaluate() évalue sur le jeu de test. model.predict() fait de l'inférence."
},
{b:"Bloc 1 — Mécaniques du Deep Learning",bi:0,n:14,
text:"Quelle est la différence entre les jeux d'entraînement, de validation et de test ?",
code:null,

{b:"Bloc 4 — Réseaux Récurrents & NLP",bi:3,n:41,
text:"Pourquoi les réseaux de neurones récurrents (RNN) sont-ils adaptés aux données séquentielles contrairement aux réseaux denses ?",
code:null,
opts:["Les RNN sont plus rapides à entraîner sur des séquences longues grâce à leur architecture parallèle.","Les RNN maintiennent un état caché (hidden state) qui capture le contexte des éléments précédents de la séquence, permettant de traiter des données avec des dépendances temporelles ou séquentielles.","Les RNN n'ont pas besoin de tokenisation préalable contrairement aux réseaux denses.","Les RNN peuvent traiter des séquences de longueur variable car ils n'ont pas de couche d'entrée de taille fixe."],
ok:1,
fb:"Un réseau dense traite chaque entrée indépendamment — il n'a pas de mémoire des entrées précédentes. Un RNN maintient un état caché hₜ = f(hₜ₋₁, xₜ) qui encode le contexte accumulé. À chaque pas de temps, il prend l'entrée courante ET l'état caché précédent. Cela permet de modéliser : texte (chaque mot dépend du contexte), séries temporelles (chaque valeur dépend des précédentes), audio (chaque frame dépend des frames précédentes)."
},
{b:"Bloc 4 — Réseaux Récurrents & NLP",bi:3,n:42,
text:"Qu'est-ce que le problème du vanishing gradient dans les RNN simples et comment le LSTM le résout-il ?",
code:null,
opts:["Le vanishing gradient apparaît quand le learning rate est trop faible — le LSTM le résout avec un learning rate adaptatif.","Dans les RNN simples, les gradients deviennent exponentiellement petits lors de la rétropropagation sur de longues séquences (dépendances à long terme perdues). Le LSTM utilise des gates (forget, input, output) qui contrôlent sélectivement le flux d'information et maintiennent les gradients stables.","Le vanishing gradient est uniquement un problème des CNNs — les RNN ne sont pas affectés.","Le LSTM résout le vanishing gradient en utilisant la normalisation batch sur chaque pas de temps."],
ok:1,
fb:"Vanishing gradient dans les RNN : lors de la backpropagation through time (BPTT), les gradients sont multipliés par la dérivée de tanh à chaque pas de temps → devient exponentiellement petit → le réseau 'oublie' les dépendances à long terme. LSTM (Long Short-Term Memory) : maintient une cellule mémoire Cₜ avec une porte d'oubli (forget gate), une porte d'entrée (input gate) et une porte de sortie (output gate). Ces gates permettent de contrôler ce qu'on garde/oublie et maintiennent les gradients sur de longues séquences."
},

const BNAMES = [
  "Mécaniques du Deep Learning",
  "Réseaux Convolutionnels & Vision",
  "Transfer Learning & Fine-tuning",
  "Réseaux Récurrents & NLP"
];
const BTOTALS = [20,20,20,15];
const LETTERS = ['A','B','C','D'];

let S = {screen:'intro',cur:0,score:0,ans:false,bs:[0,0,0,0]};

function pct(s,t){return t===0?0:Math.round(s/t*100);}

function uh(){
  const hs=document.getElementById('header-score');
  const sub=document.getElementById('header-sub');
  if(S.screen==='question'){
    hs.style.display='block';
    hs.textContent=S.score+' / '+S.cur+' ok';
    sub.textContent='Q'+Q[S.cur].n+'/'+Q.length+' — '+Q[S.cur].b;
  } else if(S.screen==='result'){
    hs.style.display='none';
    sub.textContent='Résultats finaux';
  } else {
    hs.style.display='none';
    sub.textContent='QCM de positionnement — CYBERSTRUCT';
  }
}

function intro(){
  S.screen='intro'; uh();
  document.getElementById('app').innerHTML=`
  <div class="intro-card card-anim">
    <div class="intro-title">NVIDIA DLI — Fundamentals of Deep Learning</div>
    <div class="intro-sub">75 questions couvrant les 7 notebooks officiels du cours NVIDIA DLI, incluant MNIST, ASL, CNN, augmentation, doggy door, transfer learning, headline generator et l'assessment final. Mix théorie + code Python/Keras. Note : l'évaluation réelle est un coding assessment pratique (seuil 92%) — ce QCM prépare la partie conceptuelle.</div>
    <div class="intro-stats">
      <div class="intro-stat"><div class="intro-stat-val">75</div><div class="intro-stat-label">questions</div></div>
      <div class="intro-stat"><div class="intro-stat-val">80%</div><div class="intro-stat-label">objectif visé</div></div>
      <div class="intro-stat"><div class="intro-stat-val">~60 min</div><div class="intro-stat-label">durée estimée</div></div>
    </div>
    <div class="intro-blocs">
      <div class="intro-blocs-title">Blocs du cours officiel (7 notebooks)</div>
      ${[
        ["1","Mécaniques du DL (MNIST, normalisation, loss, backprop, overfitting, Keras...)","18 q"],
        ["2","Réseaux Convolutionnels & Vision (ASL, CNN, pooling, data augmentation, summary...)","18 q"],
        ["3","Transfer Learning & Fine-tuning (doggy door, presidential, déploiement, assessment 92%...)","17 q"],
        ["4","Réseaux Récurrents & NLP (headline generator, LSTM, embedding, Transformer, température...)","12 q"]
      ].map(([n,name,q])=>`
      <div class="intro-bloc-item">
        <div class="intro-bloc-num">${n}</div>
        <span>${name}</span>
        <span class="intro-bloc-q">${q}</span>
      </div>`).join('')}
    </div>
    <button class="btn-start" onclick="start()">Commencer le QCM</button>
  </div>`;
}

function start(){
  S={screen:'question',cur:0,score:0,ans:false,bs:[0,0,0,0]};
  render();
}

function render(){
  S.screen='question'; S.ans=false; uh();
  const q=Q[S.cur];
  const prog=Math.round(S.cur/Q.length*100);
  document.getElementById('app').innerHTML=`
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
    <div class="progress-labels"><span>Q${q.n} / ${Q.length}</span><span>${prog}%</span></div>
  </div>
  <div class="card card-anim">
    <div class="bloc-badge">${q.b}</div>
    <div class="question-text">${q.text}</div>
    ${q.code?`<div class="code-block">${q.code}</div>`:''}
    <div class="options" id="opts">
      ${q.opts.map((o,i)=>`
      <button class="option-btn" onclick="ans(${i})">
        <span class="option-letter">${LETTERS[i]}</span>
        <span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="nav-row" id="nav" style="display:none">
      <button class="btn-next" onclick="next()">${S.cur<Q.length-1?'Question suivante →':'Voir mes résultats →'}</button>
    </div>
  </div>`;
}

function ans(i){
  if(S.ans)return;
  S.ans=true;
  const q=Q[S.cur];
  const ok=i===q.ok;
  if(ok){S.score++;S.bs[q.bi]++;}
  document.querySelectorAll('.option-btn').forEach((b,j)=>{
    b.disabled=true;
    if(j===i&&ok)b.classList.add('correct');
    if(j===i&&!ok)b.classList.add('wrong');
    if(j===q.ok&&!ok)b.classList.add('reveal-correct');
  });
  document.getElementById('fb').innerHTML=`
  <div class="feedback-box ${ok?'correct':'wrong'}">
    <span class="feedback-label">${ok?'✓ Bonne réponse':'✗ Mauvaise réponse'}</span>${q.fb}
  </div>`;
  document.getElementById('nav').style.display='flex';
  uh();
}

function next(){
  S.cur++;
  if(S.cur>=Q.length) result();
  else render();
}

function result(){
  S.screen='result'; uh();
  const p=pct(S.score,Q.length);
  let vt,vs;
  if(p>=80){vt='Excellent — bonne maîtrise théorique du Deep Learning !';vs='background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);';}
  else if(p>=65){vt='Bon niveau — quelques notions à consolider avant le coding assessment.';vs='background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text);';}
  else{vt='Réviser les fondamentaux — reprendre les notebooks du cours NVIDIA DLI.';vs='background:var(--error-bg);border-color:var(--error-border);color:var(--error-text);';}
  const bc=BNAMES.map((n,i)=>`
  <div class="bloc-card">
    <div class="bloc-card-name">${n}</div>
    <div class="bloc-card-score">${S.bs[i]}/${BTOTALS[i]}<span class="bloc-card-pct">(${pct(S.bs[i],BTOTALS[i])}%)</span></div>
  </div>`).join('');
  document.getElementById('app').innerHTML=`
  <div class="result-card card-anim">
    <div class="result-pct">${p}%</div>
    <div class="result-fraction">${S.score} / ${Q.length} bonnes réponses</div>
    <div class="result-verdict" style="${vs}">${vt}</div>
    <div class="bloc-grid">${bc}</div>
    <div class="threshold-note">⚠ L'assessment NVIDIA DLI est un coding pratique (seuil 92% d'accuracy). Ce quiz évalue la partie théorique — objectif visé : 80%+ soit 60/75.</div>
    <button class="btn-restart" onclick="restart()">Recommencer le QCM</button>
  </div>`;
}

function restart(){
  S={screen:'intro',cur:0,score:0,ans:false,bs:[0,0,0,0]};
  intro();
}

intro();
</script>
