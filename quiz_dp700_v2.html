{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:51,
text:"Comment monitorer l'exécution des pipelines dans Microsoft Fabric ?",
code:null,
opts:["On utilise uniquement Azure Monitor pour surveiller les pipelines Fabric.","Les pipelines Fabric ne peuvent pas être monitorés — seuls les notebooks le peuvent.","Via le Monitoring Hub Fabric (vue centralisée de toutes les exécutions), l'historique d'exécution dans chaque pipeline, les alertes configurées dans les paramètres du workspace, et le Data Factory Monitoring pour les détails d'activité.","On doit exporter les logs vers Azure Log Analytics pour les monitorer."],
ok:2,
fb:"Le monitoring des pipelines dans Fabric se fait via : Monitoring Hub — vue centralisée de toutes les exécutions de pipelines, notebooks, Spark jobs dans le workspace. Statuts : Running, Succeeded, Failed, Cancelled. Dans chaque pipeline : onglet 'Monitor' avec l'historique des runs, le temps d'exécution par activité, les erreurs. Alerts : configurer des alertes email/webhook sur les échecs. Workspace Logging : logs d'audit vers un Lakehouse. Fabric Capacity Metrics App : pour monitorer la consommation de CUs."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:52,
text:"Comment diagnostiquer et résoudre une erreur dans un pipeline Fabric qui échoue sur une activité 'Copy Data' ?",
code:null,
opts:["Supprimer et recréer le pipeline — c'est la seule façon de résoudre les erreurs.","Dans le Monitoring Hub ou l'onglet Monitor du pipeline : cliquer sur l'exécution échouée → voir le message d'erreur de l'activité Copy → vérifier : les credentials de la source/destination, la disponibilité de la source, le mapping des colonnes, les permissions sur le Lakehouse, la validité du schéma. Corriger et relancer.","Les erreurs Copy Activity sont toujours des erreurs réseau — vérifier la connexion.","On doit contacter le support Microsoft pour chaque erreur de pipeline."],
ok:1,
fb:"Debugging d'une erreur Copy Activity dans Fabric : le message d'erreur dans le Monitoring Hub contient le code d'erreur et le détail. Erreurs courantes : 'Access denied' → vérifier les permissions Fabric/ADLS. 'Schema mismatch' → le mapping des colonnes est incorrect. 'Connection timeout' → la source est indisponible. 'Row count mismatch' → data truncation ou conversion error. 'Invalid credentials' → token expiré ou secret rotation. Pour chaque activité échouée, les détails de l'input/output sont disponibles pour le debugging."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:53,
text:"Comment optimiser les performances d'une table Delta Lake dans un Lakehouse Fabric ?",
code:'-- Via SQL Endpoint\nOPTIMIZE lakehouse.silver.fact_sales\nZORDER BY (customer_id, sale_date)\n\n-- Via PySpark\nfrom delta.tables import DeltaTable\nDeltaTable.forPath(spark, path).optimize().zorderBy("customer_id", "sale_date")',
opts:["Il suffit d'ajouter un index sur la colonne clé — comme dans SQL Server.","OPTIMIZE compacte les petits fichiers Parquet en fichiers plus gros (file compaction) pour réduire le overhead de lecture. ZORDER BY réorganise les données par colonne(s) fréquemment filtrées pour maximiser le data skipping — les requêtes filtrant sur ces colonnes lisent beaucoup moins de fichiers.","OPTIMIZE est une opération destructive qui supprime définitivement les anciennes données.","ZORDER BY ne fonctionne que si la table a moins de 100 fichiers."],
ok:1,
fb:"Optimisation Delta Lake dans Fabric : OPTIMIZE (file compaction) — fusionne les nombreux petits fichiers Parquet en fichiers de ~128MB → réduit le nombre de fichiers à lire, améliore les I/O. ZORDER BY (co-clustering) — réorganise physiquement les données par les colonnes spécifiées → le data skipping est plus efficace car les valeurs similaires sont co-localisées. VACUUM — supprime les anciens fichiers Delta (au-delà de la période de rétention, défaut 7 jours). ANALYZE TABLE — met à jour les statistiques pour l'optimiseur de requêtes. Ces opérations sont planifiables dans un Pipeline nocturne."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:54,
text:"Comment configurer des alertes pour les erreurs d'un pipeline Fabric ?",
code:null,
opts:["Via Data Activator (Reflex dans Fabric) : connecté au Monitoring Hub, il peut déclencher des alertes email/Teams/webhook quand un pipeline échoue. Alternativement : configurer des notifications directement dans les paramètres du pipeline (Email on failure). Pour des alertes avancées : webhook vers Logic App ou Power Automate.","On ne peut configurer des alertes que via Azure Monitor External.","Les alertes sont uniquement disponibles pour les notebooks, pas les pipelines.","On doit créer une Logic App Azure qui poll l'API Fabric toutes les 5 minutes."],
ok:0,
fb:"Les alertes dans Fabric se configurent via : Fabric Activator (Data Activator/Reflex) — outil no-code pour créer des règles d'alertes sur n'importe quel événement Fabric (pipeline échoué, anomalie de données...) → notifie par email, Teams, webhook. Pipeline Settings → Notifications → configurer email on failure/success. Fabric Capacity Metrics App → alertes sur la consommation des CUs (throttling). Power Automate → déclenché par un webhook Fabric pour des workflows d'alerte complexes."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:55,
text:"Comment monitorer l'actualisation d'un modèle sémantique (Semantic Model) dans Fabric ?",
code:null,
opts:["On monitore les modèles sémantiques uniquement dans Power BI Service.","Dans Fabric : Monitoring Hub → filtrer par 'Semantic model refresh'. On voit le statut (Success/Failed), la durée, le mode (Import/DirectQuery/Direct Lake). En cas d'échec : consulter le message d'erreur (souvent source indisponible, timeout, credentials expirés). Pour les modèles Direct Lake : un fallback vers DirectQuery se produit si les données ne sont pas en mémoire.","Les modèles sémantiques Fabric ne se rafraîchissent pas — seuls les datasets Power BI le font.","Le monitoring des modèles sémantiques nécessite une licence Power BI Premium."],
ok:1,
fb:"Monitoring des Semantic Model refresh dans Fabric : Monitoring Hub → Semantic model refresh history. Statuts : Completed, Failed, Disabled. En cas d'échec : le message d'erreur indique la cause (datasource unavailable, credentials expired, memory exceeded, timeout). Pour les modèles Direct Lake : si les données ne sont pas en mémoire, Fabric bascule automatiquement en DirectQuery (fallback) → performances dégradées mais toujours fonctionnel. Pour les grands modèles : activer 'Large model storage format' et optimiser les partitions."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:56,
text:"Comment identifier et résoudre un goulot d'étranglement (bottleneck) dans un notebook PySpark Fabric ?",
code:null,
opts:["En augmentant la taille du cluster Spark (plus de nœuds).","Via le Spark UI (accessible depuis le Monitoring Hub) : analyser le DAG des jobs, identifier les stages longs, inspecter les shuffle reads/writes (signe de skew), les temps d'I/O et les tâches OOM (Out of Memory). Solutions : cache(), repartition(), broadcast join, optimiser les filtres (pushdown), utiliser les formats optimisés (Delta, Parquet).","Les notebooks Fabric n'ont pas d'outil de profiling — on doit ajouter des timestamps manuellement.","Il suffit d'augmenter la mémoire de l'exécuteur Spark dans la configuration."],
ok:1,
fb:"Profiling PySpark dans Fabric : Spark UI (tab 'Monitoring') → DAG visualization → voir quels stages consomment le plus de temps. Indicateurs de problèmes : Data skew → une tâche prend 100x plus de temps que les autres → solutions : salting technique, repartition(). Shuffle → trop de données déplacées entre executors → réduire les large joins, utiliser broadcast join pour les petites tables (broadcast(df_small)). I/O bottleneck → lire trop de fichiers petits → OPTIMIZE la table Delta. OOM → executors qui crash → augmenter spark.executor.memory ou réduire le batch size."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:57,
text:"Comment optimiser les performances d'un Warehouse Fabric pour des requêtes analytiques complexes ?",
code:null,
opts:["En ajoutant des index clustered sur toutes les tables du Warehouse.","Les Warehouses Fabric ont des performances fixes — on ne peut pas les optimiser.","Créer des statistiques sur les colonnes de jointure et de filtre (CREATE STATISTICS), utiliser des résultats de requêtes en cache (query result caching), matérialiser des agrégations fréquentes dans des tables Gold, utiliser des CTEs pour simplifier et optimiser le plan d'exécution, vérifier les query plans pour identifier les full table scans.","Utiliser des vues indexées (INDEXED VIEWS) comme dans SQL Server."],
ok:2,
fb:"Optimisation du Fabric Warehouse : Statistics → CREATE STATISTICS sur les colonnes de JOIN/WHERE → l'optimiseur de requêtes génère de meilleurs plans. Result Set Caching → les requêtes identiques retournent le cache directement (sub-second). Materialized Gold Tables → pré-calculer les agrégations fréquentes. Query Plan Analysis → Explain Plan dans les requêtes SQL pour identifier les opérations coûteuses. Partitionnement logique → diviser les grandes tables par date. Pour les Fact Tables larges : éviter les SELECT * et sélectionner uniquement les colonnes nécessaires (profite du format colonnaire Parquet)."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:58,
text:"Comment identifier et résoudre des erreurs dans un Dataflow Gen2 dans Fabric ?",
code:null,
opts:["On ne peut pas débugger les Dataflows Gen2 — ils doivent être reconstruits en cas d'erreur.","Dans l'éditeur Dataflow Gen2 : le panneau de preview montre les erreurs de transformation en temps réel par colonne. Après l'exécution : Monitoring Hub → Dataflow refresh history → message d'erreur. Erreurs courantes : source indisponible, type mismatch (conversion d'entier vers string attendu), mémoire insuffisante (activer Staging). Solutions : valider le schéma source, activer 'Data Preview', vérifier les Linked Services.","Les erreurs Dataflow sont toujours des problèmes de permissions.","Toujours convertir les Dataflows en notebooks PySpark pour le debugging."],
ok:1,
fb:"Debugging Dataflow Gen2 dans Fabric : Preview pane dans l'éditeur → chaque étape M montre un aperçu des données et les erreurs de transformation (colonnes en rouge). Après exécution échouée → Monitoring Hub → Dataflow refresh → Error message (avec erreur M et contexte). Erreurs courantes : Formula.Firewall (accès à plusieurs sources → activer 'Fast Combine'), mémoire (grands datasets → activer Staging Lakehouse), type conversion (explicitement caster les colonnes). L'éditeur avancé M permet de débugger le code Power Query étape par étape."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:59,
text:"Comment optimiser les performances de l'Eventstream et de l'Eventhouse dans Fabric ?",
code:null,
opts:["L'Eventstream et l'Eventhouse sont automatiquement optimisés par Fabric.","Pour l'Eventstream : configurer le bon Consumer group, éviter les transformations inutiles, utiliser le batching approprié. Pour l'Eventhouse : choisir le bon retention period, activer les hot cache pour les données fréquemment accédées, utiliser des Materialized Views KQL pour les agrégations pré-calculées, optimiser les ingestion policies (batch vs streaming).","On doit augmenter la Fabric Capacity pour tout problème de performance Eventstream.","L'Eventhouse ne peut pas être optimisé — ses performances sont fixes."],
ok:1,
fb:"Optimisation Eventstream + Eventhouse : Eventstream → configurer la taille des batches (micro-batching vs streaming continu), filtrer les événements inutiles en amont, utiliser des fanout (un input → plusieurs outputs). Eventhouse (KQL) → Hot cache policy : définir quelles données restent en mémoire RAM (default 31 jours chaud, au-delà = cold storage = disque). Materialized Views KQL : pré-calculent et stockent le résultat de requêtes fréquentes (comme des index ou des vues matérialisées). Retention policy : supprimer automatiquement les données plus vieilles que N jours. Partitioning : sharding des données par colonne temporelle."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:60,
text:"Scénario : Les requêtes sur un Lakehouse Fabric prennent de plus en plus de temps. Vous constatez des milliers de petits fichiers Parquet dans OneLake. Quelle est la solution ?",
code:null,
opts:["Exécuter OPTIMIZE sur la table Delta Lake — il fusionne les petits fichiers en fichiers de taille optimale (~128MB). Planifier OPTIMIZE régulièrement (ex. toutes les nuits dans un Pipeline). Ajouter ZORDER BY sur les colonnes de filtre fréquentes. Activer Auto-optimize si disponible.","Supprimer les anciens fichiers manuellement depuis OneLake.","Augmenter la Fabric Capacity pour gérer plus de petits fichiers.","Recréer le Lakehouse depuis zéro avec des fichiers plus gros."],
ok:0,
fb:"Le 'small files problem' est un problème classique Delta Lake : trop de fichiers petits → overhead de listing des fichiers → requêtes lentes. Solution : OPTIMIZE (file compaction) fusionne les fichiers en ~128MB. Dans Fabric, OPTIMIZE peut être exécuté via : SQL Endpoint (OPTIMIZE tableName), PySpark (DeltaTable.optimize().executeCompaction()), ou Pipeline planifié. Auto-OPTIMIZE (option Delta) peut compacter automatiquement lors des écritures. VACUUM (après rétention) supprime les anciens fichiers pour libérer de l'espace. Recommandation : planifier OPTIMIZE + VACUUM toutes les nuits."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:61,
text:"Comment monitorer les données d'ingestion dans Fabric pour détecter les anomalies ?",
code:null,
opts:["On utilise Azure Application Insights pour monitorer l'ingestion Fabric.","Via le Monitoring Hub (statut et durée des pipelines), les Workspace Logs (nombre de lignes ingérées, erreurs), Fabric Activator pour des alertes sur des seuils (ex. alerte si moins de X lignes ingérées en une heure), et des dashboards KQL/Power BI sur les métriques d'ingestion.","L'ingestion dans Fabric est automatiquement validée — aucun monitoring n'est nécessaire.","On doit installer un agent sur les serveurs sources pour monitorer l'ingestion."],
ok:1,
fb:"Monitoring de l'ingestion dans Fabric : Monitoring Hub → pipelines et Eventstreams en cours. Workspace Logging → logs des Copy Activities (lignes lues/écrites, durée, erreurs) dans un Lakehouse. KQL Database → .show ingestion failures pour voir les erreurs d'ingestion dans l'Eventhouse. Fabric Activator (Data Activator) → créer des règles : si le nombre de lignes ingérées est < seuil ou si des erreurs sont détectées → alerte email/Teams. Power BI Dashboard → tableau de bord des métriques d'ingestion (fraîcheur des données, volume, latence)."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:62,
text:"Comment identifier et résoudre des erreurs KQL dans un Eventhouse Fabric ?",
code:"// Requête KQL qui génère une erreur\nSensorData\n| where timestamp > ago(1h)\n| join kind=inner (\n    DeviceInfo\n    | project deviceId, deviceName\n  ) on deviceId\n| summarize avg_temp = avg(temperature) by DeviceInfo.deviceName",
opts:["Les erreurs KQL sont automatiquement corrigées par Fabric.","Identifier l'erreur : la colonne 'DeviceInfo.deviceName' devrait être 'deviceName' après le join (le préfixe du nom de table est incorrect). Utiliser l'éditeur KQL avec IntelliSense pour détecter les erreurs de syntaxe. Vérifier le schéma des tables avec .show table SensorData schema.","Les JOINs ne sont pas supportés dans KQL — utiliser UNION ALL.","Remplacer KQL par T-SQL pour les requêtes avec JOIN."],
ok:1,
fb:"La requête a une erreur : après un join KQL, les colonnes de la table de droite sont accessibles directement (sans préfixe de table). La correction : | summarize avg_temp = avg(temperature) by deviceName. Pour débugger KQL : l'éditeur dans Fabric affiche les erreurs de syntaxe avec IntelliSense. .show table TableName schema → vérifie les colonnes disponibles. .show ingestion failures → erreurs d'ingestion. let variables → tester des sous-requêtes isolément. L'onglet Results montre les erreurs d'exécution avec le message détaillé."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:63,
text:"Comment optimiser les performances Spark dans Fabric pour éviter les OOM (Out of Memory) dans les notebooks ?",
code:'# Configurations Spark pour optimiser la mémoire\nspark.conf.set("spark.sql.adaptive.enabled", "true")\nspark.conf.set("spark.sql.adaptive.coalescePartitions.enabled", "true")\nspark.conf.set("spark.sql.files.maxPartitionBytes", "134217728")  # 128MB',
opts:["Toujours augmenter la taille du cluster Spark pour éviter les OOM.","Activer Adaptive Query Execution (AQE) qui ajuste dynamiquement les partitions et les join strategies. Configurer maxPartitionBytes pour contrôler la taille des partitions. Utiliser cache() stratégiquement (et unpersist() après utilisation). Éviter les collect() sur de grands datasets. Préférer les opérations set-based aux row-by-row operations.","Les OOM dans Fabric ne peuvent pas être prévenus — c'est un bug connu.","Toujours diviser les notebooks en petits morceaux de 1000 lignes max."],
ok:1,
fb:"Optimisation mémoire Spark dans Fabric : AQE (Adaptive Query Execution) → ajuste dynamiquement les plans de requête à l'exécution, fusionne les petites partitions, sélectionne la meilleure stratégie de JOIN. coalescePartitions → réduit le nombre de partitions après shuffle (évite les petites partitions). maxPartitionBytes → contrôle la taille max des partitions de lecture. Autres optimisations : broadcast join pour les petites tables (< 10MB → spark.sql.autoBroadcastJoinThreshold). cache() → utiliser judicieusement (coûteux). Éviter les Python UDFs (lents) → préférer les Spark SQL functions native."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:64,
text:"Comment résoudre cette erreur T-SQL dans le Fabric Warehouse lors d'une insertion ?",
code:"INSERT INTO dbo.fact_sales\nSELECT order_id, customer_id, amount, sale_date\nFROM staging.stg_orders\n\n-- Erreur : \"Cannot insert explicit value for identity column\"\n-- in table 'fact_sales' when IDENTITY_INSERT is set to OFF\"",
opts:["L'INSERT est impossible dans le Fabric Warehouse — seul le COPY INTO est supporté.","Retirer la colonne IDENTITY de la liste des colonnes sélectionnées — laisser Fabric générer automatiquement la valeur. Le Fabric Warehouse ne supporte pas SET IDENTITY_INSERT contrairement à SQL Server traditionnel.","Activer SET IDENTITY_INSERT dbo.fact_sales ON puis relancer l'INSERT.","Modifier le type de la colonne IDENTITY en BIGINT normal."],
ok:1,
fb:"Important : le Fabric Warehouse ne supporte PAS la commande SET IDENTITY_INSERT (contrairement à SQL Server / Azure SQL DB). La seule solution est de retirer la colonne IDENTITY de la liste SELECT → Fabric génère automatiquement la valeur séquentielle. Si on a besoin de préserver des IDs existants lors d'une migration, il faut : 1) supprimer la contrainte IDENTITY (en recréant la table sans IDENTITY), 2) insérer les données avec les IDs existants, 3) rétablir la séquence si nécessaire. Vérifier toujours les fonctionnalités T-SQL supportées dans le Fabric Warehouse sur Microsoft Learn avant de supposer la parité avec SQL Server."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:65,
text:"Comment optimiser une requête SQL dans le Fabric Warehouse qui fait un full scan d'une table de 1 milliard de lignes ?",
code:'-- Requête lente (full table scan)\nSELECT customer_id, SUM(amount) as total\nFROM dbo.fact_sales\nWHERE YEAR(sale_date) = 2024\nGROUP BY customer_id\n\n-- Requête optimisée\nSELECT customer_id, SUM(amount) as total\nFROM dbo.fact_sales\nWHERE sale_date >= \'2024-01-01\' AND sale_date < \'2025-01-01\'\nGROUP BY customer_id',
opts:["Créer un index clustered sur sale_date dans le Warehouse (non supporté dans Fabric Warehouse).","Remplacer YEAR(sale_date) = 2024 par une condition sur la plage de dates brute (sale_date >= '2024-01-01' AND sale_date < '2025-01-01') — YEAR() est une fonction non-sargable qui empêche l'utilisation des statistiques et du data skipping. Créer des statistiques sur sale_date. Matérialiser des agrégations annuelles dans une table Gold.","Augmenter la Fabric Capacity F-SKU.","Utiliser NOLOCK pour accélérer la lecture."],
ok:1,
fb:"SARGABLE predicates (Search ARGument ABLE) : les filtres doivent utiliser directement la colonne pour que les statistiques et le data skipping soient efficaces. YEAR(sale_date) = 2024 → non-sargable (fonction sur la colonne → scan complet). sale_date >= '2024-01-01' AND sale_date < '2025-01-01' → sargable → utilise les statistiques et le data skipping Delta. Note : le Fabric Warehouse ne supporte PAS les index clustered ou non-clustered comme SQL Server — l'optimisation passe par CREATE STATISTICS, la matérialisation de résultats et les requêtes sargable. NOLOCK n'est pas non plus supporté dans Fabric Warehouse."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:66,
text:"Comment résoudre une erreur de Shortcut dans Fabric quand le Shortcut pointe vers des données ADLS Gen2 inaccessibles ?",
code:null,
opts:["Supprimer et recréer le Shortcut.","Vérifier : les credentials du Shortcut (Managed Identity ou Account Key ou SPN), les permissions RBAC sur le storage account ADLS (Storage Blob Data Reader minimum), la disponibilité du storage account (Azure Portal), la validité du chemin (container/dossier), et les politiques de firewall ADLS qui pourraient bloquer l'accès depuis Fabric.","Les Shortcuts ADLS Gen2 ne peuvent pas pointer vers des comptes dans un autre tenant Azure.","Activer le mode Public access sur le storage account ADLS."],
ok:1,
fb:"Diagnostic d'un Shortcut ADLS Gen2 inaccessible : 1) Credentials → vérifier que la Managed Identity du workspace Fabric a le rôle 'Storage Blob Data Reader' sur le container ADLS (ou que le Account Key / SPN est valide et non expiré). 2) Firewall ADLS → si le storage a un firewall activé, ajouter les IPs Fabric ou utiliser Private Endpoints. 3) Chemin ABFSS → vérifier que le container et le chemin existent. 4) Cross-tenant → possible mais nécessite une configuration SPN spécifique. Le message d'erreur du Shortcut dans Fabric indique généralement la cause précise."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:67,
text:"Comment monitorer la transformation des données dans Fabric pour détecter les dégradations de qualité ?",
code:null,
opts:["On ne peut pas monitorer la qualité des données dans Fabric.","Via des Great Expectations ou des règles de validation dans les notebooks (ex. vérifier le nombre de NULLs, les valeurs hors plage, la cohérence référentielle) combinés avec des alertes Fabric Activator. Le Fabric Data Quality (via OneLake Health) peut aussi signaler les anomalies automatiquement.","La qualité des données est garantie automatiquement par Delta Lake.","On doit créer des tests unitaires Python pour chaque pipeline."],
ok:1,
fb:"Monitoring de la qualité des données dans Fabric : Notebooks de validation → après chaque transformation, vérifier : count de lignes (vs attendu), % de NULLs (< seuil), unicité des clés, plages de valeurs, cohérence référentielle. Résultats stockés dans une table de métriques de qualité. Fabric Activator → déclenche une alerte si une métrique dépasse le seuil. Power BI Dashboard de qualité → visualise les métriques au fil du temps. Approche recommandée : tester à chaque couche (Bronze, Silver, Gold) plutôt qu'une seule fois en fin de pipeline."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:68,
text:"Scénario : Un notebook PySpark dans Fabric prend 3 heures à s'exécuter. En analysant le Spark UI, vous constatez qu'un seul stage prend 2h50 à cause d'une tâche qui traite 90% des données. Quel est le problème et comment le résoudre ?",
code:null,
opts:["Le problème est un timeout de connexion — augmenter spark.network.timeout.","C'est du Data Skew : une partition contient une quantité disproportionnée de données (une valeur de clé très fréquente). Solution : salting technique (ajouter un suffixe aléatoire à la clé de jointure pour distribuer la charge), repartitionner sur une colonne plus distribuée, ou utiliser un broadcast join si une table est petite.","C'est une erreur de mémoire — augmenter la taille des executors.","C'est un problème de réseau — déplacer les données vers un Lakehouse différent."],
ok:1,
fb:"Le Data Skew est une cause majeure de lenteur Spark : une partition reçoit beaucoup plus de données que les autres (ex. clé de jointure avec une valeur très fréquente comme 'Unknown'). Symptôme dans Spark UI : une tâche prend 100x plus de temps que les autres dans le même stage. Solutions : 1) Salting — ajouter CONCAT(key, '_', FLOOR(RAND()*10)) pour distribuer les données. 2) Broadcast join — si la table de droite est petite (<10MB) → JOIN.broadcast(). 3) Repartition — spark.repartition(n) ou repartitionByRange() sur une colonne plus uniforme. 4) Skew hint — Spark 3.x AQE gère automatiquement le skew avec spark.sql.adaptive.skewJoin.enabled=true."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:69,
text:"Qu'est-ce que le Query Folding dans Power Query (Dataflow Gen2) et pourquoi est-il important ?",
code:null,
opts:["Le Query Folding est une technique de compression des requêtes M pour réduire la taille du code.","Le Query Folding est la capacité de Power Query à traduire les transformations M en requêtes natives de la source (SQL, OData...) plutôt que de charger toutes les données puis les filtrer côté client. Quand le folding est actif, le filtrage et les agrégations s'exécutent dans la source — beaucoup plus efficace pour les grands volumes.","Le Query Folding ne s'applique qu'aux sources HTTP REST — pas aux bases SQL.","Le Query Folding désactive les optimisations Spark dans Dataflow Gen2."],
ok:1,
fb:"Le Query Folding est fondamental pour les performances Dataflow Gen2 : sans folding → Power Query charge toutes les données dans son runtime puis applique les filtres (inefficace pour les grands volumes). Avec folding → les transformations sont traduites en SQL/OData et exécutées dans la source → seules les données nécessaires sont transférées. Indicateur dans Power Query : clic-droit sur une étape → 'View Native Query' (si disponible → folding actif). Certaines opérations cassent le folding : custom functions M, certaines jointures complexes → à éviter si possible."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:70,
text:"Comment utiliser la Fabric Capacity Metrics App pour diagnostiquer un throttling (limitation de performance) ?",
code:null,
opts:["La Fabric Capacity Metrics App est uniquement disponible pour les administrateurs Microsoft.","L'app Power BI 'Microsoft Fabric Capacity Metrics' (installée depuis AppSource) montre la consommation des CUs par workload et par workspace — en cas de throttling, elle identifie quel workload consomme le plus. On peut voir les 'Rejection' et 'Delay' events qui indiquent le throttling.","Le throttling est uniquement visible dans les logs Azure Monitor.","Il faut contacter Microsoft Support pour diagnostiquer le throttling."],
ok:1,
fb:"La Microsoft Fabric Capacity Metrics App (Power BI app) est l'outil clé pour le monitoring de la capacité : Timepoint view → CUs consommés au fil du temps. Interactive vs Background CUs (les Background ont une priorité plus basse → throttlés en premier). Rejection events → workloads refusés car la capacité est épuisée. Burndown chart → consommation cumulée des CUs. Par workspace → identifier les workspaces les plus consommateurs. Actions en cas de throttling : scale up la capacity, optimiser les workloads gourmands, planifier les gros jobs en heures creuses, pauser les jobs non-urgents."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:71,
text:"Comment résoudre des erreurs dans un Eventstream Fabric quand des événements sont perdus ou mal formatés ?",
code:null,
opts:["Redémarrer l'Eventstream — les événements perdus sont automatiquement rejoués.","Via le Monitoring Hub → Eventstream → voir les erreurs d'ingestion. Activer le 'Dead Letter' pour capturer les événements mal formatés dans un Lakehouse. Vérifier le schéma d'entrée (JSON malformé, champs manquants). Utiliser 'Reject on error' vs 'Drop on error' selon le besoin. Valider les transformations Eventstream avec les données de test.","Les événements perdus dans l'Eventstream ne peuvent pas être récupérés.","Utiliser un backup Eventstream pour capturer les données manquantes."],
ok:1,
fb:"Debugging Eventstream dans Fabric : Monitoring Hub → Eventstream → statut et métriques (events/sec, errors). Événements mal formatés → activer le Dead Letter Lakehouse (capture les événements qui ne peuvent pas être parsés). Transformation errors → vérifier les expressions de transformation dans l'Eventstream editor. Schema evolution → si le schéma source change, adapter les transformations. Offset management → dans les sources basées sur des offsets (Event Hubs), vérifier que l'offset de départ est correct pour éviter les données manquantes ou les doublons."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:72,
text:"Scénario : Votre équipe reçoit des plaintes que les rapports Power BI sont lents lors des heures de pointe. Les données sont stockées dans un Lakehouse Fabric en mode Direct Lake. Que vérifiez-vous en premier ?",
code:null,
opts:["Changer le mode de connexion de Direct Lake vers Import.","Vérifier dans la Capacity Metrics App si la capacité est saturée (throttling) pendant les heures de pointe. Vérifier si le modèle Direct Lake tombe en fallback DirectQuery (signe de données non en cache). Vérifier les tailles des tables Delta (OPTIMIZE si beaucoup de petits fichiers). Considérer d'augmenter la Fabric Capacity pendant les heures de pointe.","Ajouter plus de nœuds au cluster Spark.","Désactiver Direct Lake et utiliser Import pour tous les rapports."],
ok:1,
fb:"Diagnostic de lenteur Power BI Direct Lake : 1) Capacity Metrics App → vérifier CUs consommés aux heures de pointe → si throttling → scale up ou optimiser les workloads. 2) Fabric Monitoring Hub → modèle sémantique → vérifier le fallback en DirectQuery (signe que les données ne sont pas en mémoire → framing issues). 3) Delta table health → OPTIMIZE + ZORDER pour réduire les fichiers petits. 4) Modèle sémantique → supprimer les colonnes inutiles, réduire la cardinalité des dimensions. 5) Power BI Performance Analyzer → identifier les visuels les plus lents."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:73,
text:"Qu'est-ce que l'exam DP-700 est 'open book' et comment en tirer parti ?",
code:null,
opts:["'Open book' signifie qu'on peut utiliser n'importe quelle ressource internet pendant l'examen.","DP-700 est open book uniquement pour la documentation Microsoft Learn — on peut ouvrir des onglets vers les pages de référence (syntaxe KQL, PySpark, T-SQL, Fabric documentation) pendant l'examen. La stratégie : connaître la structure de Microsoft Learn pour trouver rapidement la syntaxe, ne pas perdre de temps à chercher les concepts fondamentaux (les comprendre à l'avance).","'Open book' signifie qu'on peut communiquer avec son équipe pendant l'examen.","Le DP-700 n'est pas open book — c'est une information incorrecte."],
ok:1,
fb:"Le DP-700 est effectivement open book (accès à Microsoft Learn pendant l'examen). Stratégie recommandée : maîtriser les concepts (pas besoin de chercher ce qu'est un Lakehouse), utiliser Microsoft Learn uniquement pour les syntaxes précises (KQL, M, PySpark, T-SQL). Pratiquer la navigation dans Microsoft Learn avant l'examen : learn.microsoft.com/en-us/fabric/. Raccourcis utiles : chercher directement 'KQL reference', 'Fabric pipeline activities', 'Delta Lake optimization'. Le temps est limité — ne pas passer plus d'1-2 minutes par question sur la recherche."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:74,
text:"Comment monitorer et optimiser les performances d'un pipeline Fabric qui comporte des activités en parallèle ?",
code:null,
opts:["Toujours exécuter les activités en séquence pour éviter les conflits.","Dans le Monitoring Hub : analyser le timeline des activités (Gantt chart) pour identifier les activités qui bloquent le pipeline. Optimiser le parallélisme : utiliser les activités ForEach avec 'Is Sequential: false' et configurer le batch count. Éviter trop de parallelisme si cela sature la capacité Fabric. Limiter les dépendances inutiles entre activités.","Le parallélisme dans les pipelines Fabric n'est pas configurable.","Utiliser des pipelines séparés pour chaque activité et les orchestrer avec Azure Logic Apps."],
ok:1,
fb:"Optimisation des pipelines avec parallélisme dans Fabric : ForEach activity avec IsSequential=false + batchCount (nombre de traitements en parallèle). Dépendances → vérifier que les activités ne sont pas connectées inutilement (si B et C ne dépendent pas de A, les mettre en parallèle). Goulots d'étranglement → Monitoring Hub → timeline view montre quelles activités attendent. Si throttling Fabric → réduire le batchCount. Si I/O bottleneck sur la source → réduire le parallélisme Copy Activity. Règle d'or : trop de parallélisme peut saturer la source ou la destination."
},
{d:"Domaine 3 — Monitor & Optimize",dw:"30-35%",di:2,n:75,
text:"Scénario final : Vous êtes Data Engineer Fabric dans une entreprise. Un pipeline critique qui alimente un rapport exécutif Power BI échoue chaque nuit depuis 3 jours sans alerte. Quelles mesures prenez-vous immédiatement et quelles améliorations recommandez-vous ?",
code:null,
opts:["Recréer le pipeline depuis zéro avec une architecture différente.","Immédiat : 1) Monitoring Hub → analyser les 3 exécutions échouées → identifier l'erreur (message d'erreur, activité échouée). 2) Corriger la cause (credentials expirés, source indisponible, erreur SQL...). 3) Relancer manuellement. Améliorations : 4) Configurer des alertes (Fabric Activator ou email) sur l'échec. 5) Ajouter une gestion d'erreurs dans le pipeline (Try-Catch avec activité de notification). 6) Mettre en place un tableau de bord de monitoring. 7) Documenter la procédure de résolution.","Contacter Microsoft Support en priorité.","Désactiver le pipeline et utiliser une import manuelle des données."],
ok:1,
fb:"Ce scénario teste la maîtrise complète du monitoring Fabric. Approche en 2 phases : Urgence → diagnostiquer et corriger l'erreur (Monitoring Hub est la première ressource). Prévention → mettre en place les alertes et la gestion d'erreurs pour ne plus être surpris. Architecture résiliente dans Fabric : alertes proactives (Activator), retry policies sur les activités (max retry count + retry interval), notifications Teams/email sur échec, tableau de bord de monitoring Power BI sur les métriques de pipeline. La gestion des erreurs est aussi importante que le développement des pipelines."
}
];

const DNAMES = [
  "Implement & Manage",
  "Ingest & Transform",
  "Monitor & Optimize"
];
const DTOTALS = [25,25,25];
const LETTERS = ['A','B','C','D'];

let S = {screen:'intro',cur:0,score:0,ans:false,ds:[0,0,0]};

function pct(s,t){return t===0?0:Math.round(s/t*100);}

function uh(){
  const hs=document.getElementById('header-score');
  const sub=document.getElementById('header-sub');
  if(S.screen==='question'){
    hs.style.display='block';
    hs.textContent=S.score+' / '+S.cur+' ok';
    sub.textContent='Q'+Q[S.cur].n+'/'+Q.length+' — '+Q[S.cur].d;
  } else if(S.screen==='result'){
    hs.style.display='none';
    sub.textContent='Résultats finaux';
  } else {
    hs.style.display='none';
    sub.textContent='QCM de positionnement — CYBERSTRUCT';
  }
}

function intro(){
  S.screen='intro'; uh();
  document.getElementById('app').innerHTML=`
  <div class="intro-card card-anim">
    <div class="intro-title">DP-700 — Microsoft Fabric Data Engineer Associate</div>
    <div class="intro-sub">75 questions couvrant les 3 domaines officiels du blueprint DP-700 (mis à jour janvier 2026). Mix scénarios, architecture et technique (KQL, PySpark, T-SQL, Pipelines). Seuil de passage : 700/1000 (70%). Note : l'examen est open book (accès Microsoft Learn).</div>
    <div class="intro-stats">
      <div class="intro-stat"><div class="intro-stat-val">75</div><div class="intro-stat-label">questions</div></div>
      <div class="intro-stat"><div class="intro-stat-val">70%</div><div class="intro-stat-label">seuil (700/1000)</div></div>
      <div class="intro-stat"><div class="intro-stat-val">~60 min</div><div class="intro-stat-label">durée estimée</div></div>
      <div class="intro-stat"><div class="intro-stat-val">Open book</div><div class="intro-stat-label">MS Learn autorisé</div></div>
    </div>
    <div class="intro-blocs">
      <div class="intro-blocs-title">Domaines officiels DP-700 (blueprint jan. 2026)</div>
      ${[
        ["1","Implement & Manage an analytics solution (workspace, sécurité, gouvernance, orchestration, Shortcuts...)","25 q","30-35%"],
        ["2","Ingest & Transform data (batch, streaming, KQL, PySpark, T-SQL, Dataflow, medallion...)","25 q","30-35%"],
        ["3","Monitor & Optimize (monitoring, résolution d'erreurs, optimisation Delta/Spark/KQL/Warehouse...)","25 q","30-35%"]
      ].map(([n,name,q,w])=>`
      <div class="intro-bloc-item">
        <div class="intro-bloc-num">${n}</div>
        <span>${name}</span>
        <div class="intro-bloc-meta">
          <span class="intro-bloc-q">${q}</span>
          <span class="intro-bloc-w">${w}</span>
        </div>
      </div>`).join('')}
    </div>
    <button class="btn-start" onclick="start()">Commencer le QCM</button>
  </div>`;
}

function start(){
  S={screen:'question',cur:0,score:0,ans:false,ds:[0,0,0]};
  render();
}

function render(){
  S.screen='question'; S.ans=false; uh();
  const q=Q[S.cur];
  const prog=Math.round(S.cur/Q.length*100);
  document.getElementById('app').innerHTML=`
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
    <div class="progress-labels"><span>Q${q.n} / ${Q.length}</span><span>${prog}%</span></div>
  </div>
  <div class="card card-anim">
    <div class="domain-badge">${q.d} <span class="domain-weight">${q.dw}</span></div>
    <div class="question-text">${q.text}</div>
    ${q.code?`<div class="code-block">${q.code}</div>`:''}
    <div class="options" id="opts">
      ${q.opts.map((o,i)=>`
      <button class="option-btn" onclick="ans(${i})">
        <span class="option-letter">${LETTERS[i]}</span>
        <span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="nav-row" id="nav" style="display:none">
      <button class="btn-next" onclick="next()">${S.cur<Q.length-1?'Question suivante →':'Voir mes résultats →'}</button>
    </div>
  </div>`;
}

function ans(i){
  if(S.ans)return;
  S.ans=true;
  const q=Q[S.cur];
  const ok=i===q.ok;
  if(ok){S.score++;S.ds[q.di]++;}
  document.querySelectorAll('.option-btn').forEach((b,j)=>{
    b.disabled=true;
    if(j===i&&ok)b.classList.add('correct');
    if(j===i&&!ok)b.classList.add('wrong');
    if(j===q.ok&&!ok)b.classList.add('reveal-correct');
  });
  document.getElementById('fb').innerHTML=`
  <div class="feedback-box ${ok?'correct':'wrong'}">
    <span class="feedback-label">${ok?'✓ Bonne réponse':'✗ Mauvaise réponse'}</span>${q.fb}
  </div>`;
  document.getElementById('nav').style.display='flex';
  uh();
}

function next(){
  S.cur++;
  if(S.cur>=Q.length) result();
  else render();
}

function result(){
  S.screen='result'; uh();
  const p=pct(S.score,Q.length);
  let vt,vs;
  if(p>=80){vt='Excellent — niveau largement suffisant pour passer le DP-700 !';vs='background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);';}
  else if(p>=70){vt='Tu franchis le seuil (70%) — quelques révisions pour consolider.';vs='background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text);';}
  else{vt='En dessous du seuil — reprendre le learning path DP-700 sur Microsoft Learn.';vs='background:var(--error-bg);border-color:var(--error-border);color:var(--error-text);';}
  const bc=DNAMES.map((n,i)=>`
  <div class="bloc-card">
    <div class="bloc-card-name">${n}</div>
    <div class="bloc-card-score">${S.ds[i]}/${DTOTALS[i]}<span class="bloc-card-pct">(${pct(S.ds[i],DTOTALS[i])}%)</span></div>
  </div>`).join('');
  document.getElementById('app').innerHTML=`
  <div class="result-card card-anim">
    <div class="result-pct">${p}%</div>
    <div class="result-fraction">${S.score} / ${Q.length} bonnes réponses</div>
    <div class="result-verdict" style="${vs}">${vt}</div>
    <div class="bloc-grid">${bc}</div>
    <div class="threshold-note">Seuil DP-700 : 700/1000 (70%) — soit 53/75 dans ce QCM. L'examen est open book (Microsoft Learn accessible).</div>
    <button class="btn-restart" onclick="restart()">Recommencer le QCM</button>
  </div>`;
}

function restart(){
  S={screen:'intro',cur:0,score:0,ans:false,ds:[0,0,0]};
  intro();
}

intro();
</script>
</body>
</html>
