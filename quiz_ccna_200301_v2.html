<title>QCM — CCNA 200-301 v1.1 | CYBERSTRUCT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f7f4; --surface: #ffffff; --surface2: #f2f1ee;
    --text: #1a1a18; --text-muted: #6b6a66; --text-hint: #9e9d99;
    --border: rgba(0,0,0,0.10); --border-med: rgba(0,0,0,0.18);
    --accent: #0F6E56; --accent-bg: #E1F5EE; --accent-text: #085041;
    --success-bg: #EAF3DE; --success-border: #639922; --success-text: #27500A;
    --error-bg: #FCEBEB; --error-border: #E24B4A; --error-text: #A32D2D;
    --warn-bg: #FAEEDA; --warn-border: #BA7517; --warn-text: #854F0B;
    --code-bg: #1e1e1e; --code-text: #d4d4d4;
    --radius: 10px; --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --surface: #252523; --surface2: #2e2e2b;
      --text: #f0ede8; --text-muted: #a09f9a; --text-hint: #6b6a66;
      --border: rgba(255,255,255,0.10); --border-med: rgba(255,255,255,0.18);
      --accent: #1D9E75; --accent-bg: #04342C; --accent-text: #5DCAA5;
      --success-bg: #0e2206; --success-border: #3B6D11; --success-text: #C0DD97;
      --error-bg: #2a0a0a; --error-border: #A32D2D; --error-text: #F09595;
      --warn-bg: #2a1a04; --warn-border: #854F0B; --warn-text: #FAC775;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }
  .header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .header-logo { width: 32px; height: 32px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-logo svg { width: 16px; height: 16px; fill: white; }
  .header-info { flex: 1; min-width: 0; }
  .header-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-sub { font-size: 11px; color: var(--text-muted); }
  .header-score { font-size: 12px; font-weight: 500; color: var(--accent-text); background: var(--accent-bg); padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .progress-wrap { margin-bottom: 18px; }
  .progress-track { height: 3px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-hint); margin-top: 5px; }
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; }
  .bloc-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; background: var(--accent-bg); color: var(--accent-text); padding: 3px 10px; border-radius: 20px; margin-bottom: 12px; }
  .bloc-weight { font-size: 10px; opacity: 0.7; }
  .question-text { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.55; margin-bottom: 14px; }
  .code-block { background: var(--code-bg); color: var(--code-text); font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px; line-height: 1.6; padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 14px; overflow-x: auto; white-space: pre; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn { display: flex; align-items: flex-start; gap: 11px; padding: 11px 14px; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; color: var(--text); line-height: 1.5; transition: background 0.12s, border-color 0.12s, transform 0.08s; width: 100%; font-family: inherit; }
  .option-btn:hover:not(:disabled) { background: var(--surface2); border-color: var(--accent); transform: translateX(2px); }
  .option-btn:disabled { cursor: default; }
  .option-letter { font-size: 11px; font-weight: 500; min-width: 20px; height: 20px; background: var(--surface2); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; color: var(--text-muted); }
  .option-btn:hover:not(:disabled) .option-letter { background: var(--accent-bg); color: var(--accent-text); }
  .option-btn.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .option-btn.correct .option-letter { background: var(--success-border); color: white; }
  .option-btn.wrong { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .option-btn.wrong .option-letter { background: var(--error-border); color: white; }
  .option-btn.reveal-correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); opacity: 0.65; }
  .option-code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px; background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; }
  .feedback-box { margin-top: 14px; padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.65; border: 0.5px solid; animation: fadeIn 0.2s ease; }
  .feedback-box.correct { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
  .feedback-box.wrong { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }
  .feedback-label { font-weight: 500; display: block; margin-bottom: 3px; }
  .feedback-code { background: rgba(0,0,0,0.12); font-family: 'SF Mono','Fira Code','Consolas',monospace; font-size: 11px; padding: 6px 10px; border-radius: 4px; margin-top: 7px; white-space: pre; display: block; overflow-x: auto; }
  .nav-row { display: flex; justify-content: flex-end; margin-top: 16px; }
  .btn-next { padding: 9px 20px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; transition: background 0.12s; }
  .btn-next:hover { background: var(--surface2); }
  .result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 28px 22px; text-align: center; }
  .result-pct { font-size: 58px; font-weight: 500; color: var(--text); line-height: 1; margin-bottom: 5px; }
  .result-fraction { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; }
  .result-verdict { display: inline-block; font-size: 14px; font-weight: 500; padding: 9px 18px; border-radius: var(--radius-sm); margin-bottom: 24px; border: 0.5px solid; }
  .bloc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; margin-bottom: 18px; text-align: left; }
  .bloc-card { background: var(--surface2); border-radius: var(--radius-sm); padding: 11px 13px; }
  .bloc-card-name { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; line-height: 1.4; }
  .bloc-card-score { font-size: 20px; font-weight: 500; color: var(--text); }
  .bloc-card-pct { font-size: 12px; color: var(--text-hint); margin-left: 3px; }
  .threshold-note { font-size: 12px; color: var(--text-hint); margin-bottom: 18px; padding: 7px 11px; background: var(--surface2); border-radius: var(--radius-sm); }
  .btn-restart { padding: 9px 24px; font-size: 13px; font-weight: 500; border: 0.5px solid var(--border-med); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; }
  .btn-restart:hover { background: var(--surface2); }
  .intro-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 28px 24px; }
  .intro-title { font-size: 20px; font-weight: 500; margin-bottom: 6px; }
  .intro-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
  .intro-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .intro-stat { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .intro-stat-val { font-size: 19px; font-weight: 500; }
  .intro-stat-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .intro-blocs { margin-bottom: 22px; }
  .intro-blocs-title { font-size: 11px; font-weight: 500; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .intro-bloc-item { display: flex; align-items: center; gap: 9px; font-size: 12px; padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .intro-bloc-item:last-child { border-bottom: none; }
  .intro-bloc-num { width: 20px; height: 20px; background: var(--accent-bg); color: var(--accent-text); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; }
  .intro-bloc-meta { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .intro-bloc-q { font-size: 10px; color: var(--text-hint); }
  .intro-bloc-w { font-size: 10px; color: var(--accent-text); font-weight: 500; background: var(--accent-bg); padding: 1px 6px; border-radius: 10px; }
  .btn-start { width: 100%; padding: 12px; font-size: 14px; font-weight: 500; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; transition: opacity 0.12s; }
  .btn-start:hover { opacity: 0.88; }
  .card-anim { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

  </div>
  <div class="header-info">
    <div class="header-title">CCNA 200-301 v1.1</div>
    <div class="header-sub" id="header-sub">QCM de positionnement — CYBERSTRUCT</div>
  </div>
  <div class="header-score" id="header-score" style="display:none"></div>

<div class="main" id="app"></div>

<script>
const Q = [
// ═══════════════════════════════════════════════════
// DOMAINE 1 — Network Fundamentals (20%) — 15 questions
// ═══════════════════════════════════════════════════
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:1,
text:"Quelle couche du modèle OSI est responsable de l'adressage logique et du routage des paquets entre réseaux ?",
code:null,
opts:["Couche 2 — Data Link","Couche 3 — Network","Couche 4 — Transport","Couche 5 — Session"],
ok:1,
fb:"La couche 3 (Network) gère l'adressage logique (IP) et le routage inter-réseaux. La couche 2 gère l'adressage physique (MAC) et la commutation dans un même réseau. Un routeur opère en couche 3 ; un switch standard en couche 2."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:2,
text:"Vous devez sous-réseauter 192.168.10.0/24 en 6 sous-réseaux de taille égale. Quel masque de sous-réseau utiliser ?",
code:null,
opts:["/25 (255.255.255.128)","/26 (255.255.255.192)","/27 (255.255.255.224)","/28 (255.255.255.240)"],
ok:2,
fb:"/27 donne 2³ = 8 sous-réseaux (on en a besoin de 6, donc 8 ≥ 6 ✓) avec 2⁵ - 2 = 30 hôtes utilisables chacun. /26 ne donne que 4 sous-réseaux (insuffisant). /28 donne 16 sous-réseaux mais seulement 14 hôtes. La formule est : nombre de bits d'hôtes empruntés = 2ⁿ ≥ nombre de sous-réseaux requis."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:3,
text:"Quelle est l'adresse de broadcast du réseau 172.16.4.0/22 ?",
code:null,
opts:["172.16.4.255","172.16.5.255","172.16.7.255","172.16.6.255"],
ok:2,
fb:"/22 = 255.255.252.0 (22 bits réseau, 10 bits hôte). Méthode magic number sur le 3ème octet : 256 - 252 = 4 → les blocs dans le 3ème octet sont : .0.x, .4.x, .8.x... Le réseau 172.16.4.0/22 appartient au bloc qui démarre à .4, donc il couvre 172.16.4.0 → 172.16.7.255 (taille du bloc = 4 dans le 3ème octet × 256 dans le 4ème). L'adresse de broadcast = dernière adresse du bloc = 172.16.7.255."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:4,
text:"Quelle différence fondamentale distingue TCP d'UDP ?",
code:null,
opts:[
  "TCP est plus rapide car il n'utilise pas d'accusés de réception.",
  "UDP fonctionne uniquement en IPv6 ; TCP est réservé à IPv4.",
  "TCP établit une connexion fiable avec contrôle de flux et accusés de réception ; UDP envoie sans garantie de livraison ni ordre.",
  "TCP opère en couche 3 ; UDP opère en couche 4."
],
ok:2,
fb:"TCP (3-way handshake, accusés de réception, retransmission, contrôle de flux) garantit la livraison ordonnée — utilisé pour HTTP, FTP, SSH. UDP (sans connexion, sans garantie) privilégie la vitesse — utilisé pour DNS, DHCP, VoIP, streaming. Les deux opèrent en couche 4 (Transport)."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:5,
text:"Quel type de câble fibre optique est recommandé pour une liaison backbone entre deux bâtiments distants de 10 km ?",
code:null,
opts:["Multimode OM3","Multimode OM4","Single-mode OS2","Câble UTP Cat 6A"],
ok:2,
fb:"La fibre single-mode (OS1/OS2) supporte des distances allant jusqu'à 40 à 80 km grâce à son cœur très fin (9µm) qui élimine la dispersion modale. La fibre multimode (OM3/OM4) est limitée à 300-400m pour 10 Gbps. L'UTP Cat 6A est limité à 100m. Pour 10 km, seul le single-mode convient."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:6,
text:"Qu'est-ce qu'une adresse IPv6 link-local et comment est-elle générée ?",
code:null,
opts:[
  "Une adresse routée globalement, commençant par 2000::/3.",
  "Une adresse valide uniquement sur le lien local, commençant par FE80::/10, souvent auto-générée via EUI-64 ou SLAAC.",
  "Une adresse de multicast réservée aux routeurs, commençant par FF02::.",
  "Une adresse privée équivalente à 192.168.x.x en IPv4."
],
ok:1,
fb:"Les adresses link-local (FE80::/10) sont auto-configurées sur chaque interface et ne sont jamais routées au-delà du lien local. Elles servent pour la découverte de voisins (NDP) et les communications entre routeurs OSPF/EIGRP. EUI-64 les génère à partir de l'adresse MAC de l'interface."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:7,
text:"Un switch reçoit une trame destinée à une adresse MAC inconnue. Que fait-il ?",
code:null,
opts:[
  "Il supprime la trame (drop) pour éviter les boucles.",
  "Il envoie la trame uniquement au routeur par défaut.",
  "Il diffuse la trame sur tous ses ports sauf celui de réception (flooding).",
  "Il envoie une requête ARP pour trouver le destinataire."
],
ok:2,
fb:"Le comportement par défaut d'un switch sur une adresse MAC inconnue est le flooding : il envoie la trame sur tous les ports actifs sauf le port source. Quand le destinataire répond, le switch apprend son adresse MAC et met à jour sa table CAM. Ce comportement est fondamental pour comprendre les attaques MAC flooding."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:8,
text:"Quelle plage d'adresses IPv4 est réservée aux communications multicast ?",
code:null,
opts:["10.0.0.0 – 10.255.255.255","169.254.0.0 – 169.254.255.255","224.0.0.0 – 239.255.255.255","240.0.0.0 – 255.255.255.254"],
ok:2,
fb:"La plage 224.0.0.0/4 (classe D) est réservée au multicast IPv4. 224.0.0.0/24 est réservée aux protocoles de routage locaux (OSPF = 224.0.0.5/6, EIGRP = 224.0.0.10). 10.0.0.0/8 est une plage privée (RFC 1918). 169.254.0.0/16 est l'APIPA. 240.0.0.0/4 est réservée."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:9,
text:"Quelle architecture réseau Cisco est caractérisée par trois niveaux : core, distribution et access ?",
code:null,
opts:["Architecture spine-leaf","Architecture two-tier (collapsed core)","Architecture three-tier hiérarchique","Architecture SOHO"],
ok:2,
fb:"L'architecture three-tier (core / distribution / access) est le modèle de référence Cisco pour les réseaux d'entreprise larges. Le core assure la commutation rapide entre sites ; la distribution applique les politiques (QoS, ACL, routage) ; l'access connecte les terminaux. Le spine-leaf est utilisé dans les datacenters modernes."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:10,
text:"Sur un switch Cisco, la commande suivante est exécutée. Que signifie l'état 'err-disabled' sur un port ?",
code:"SW1# show interfaces GigabitEthernet0/1\nGigabitEthernet0/1 is err-disabled",
opts:[
  "Le port est administrativement désactivé avec la commande shutdown.",
  "Le port a été automatiquement désactivé par le switch suite à une violation (port-security, BPDU guard, etc.).",
  "Le port n'a pas de câble connecté (no carrier).",
  "Le port fonctionne en half-duplex, ce qui génère des erreurs."
],
ok:1,
fb:"L'état err-disabled indique que le switch a automatiquement désactivé le port suite à une violation détectée : BPDU guard (réception d'un BPDU sur un port PortFast), port-security (dépassement du nombre de MAC autorisées), ou loop detection. Pour réactiver : shutdown puis no shutdown, ou activer errdisable recovery."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:11,
text:"Quelle est la différence entre un switch Layer 2 et un switch Layer 3 ?",
code:null,
opts:[
  "Un switch L3 est plus rapide car il utilise des ASICs plus récents.",
  "Un switch L3 peut effectuer du routage IP entre VLANs en plus de la commutation — il dispose d'interfaces SVI routable.",
  "Un switch L2 ne peut pas gérer les VLANs ; seul le switch L3 le peut.",
  "Il n'y a pas de différence fonctionnelle, uniquement de prix."
],
ok:1,
fb:"Un switch L3 intègre un moteur de routage matériel (hardware routing) en plus des fonctions de commutation. Il peut router entre VLANs via des SVIs (Switch Virtual Interfaces) sans passer par un routeur externe. C'est la solution utilisée dans les couches distribution et core. Un switch L2 commute uniquement en fonction des adresses MAC."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:12,
text:"Quelle adresse IPv6 est l'équivalent de 127.0.0.1 en IPv4 ?",
code:null,
opts:["FE80::1","::1","FF02::1","2001:db8::1"],
ok:1,
fb:"::1 est l'adresse de loopback IPv6 (équivalent de 127.0.0.1). FE80::1 est une adresse link-local. FF02::1 est l'adresse multicast all-nodes. 2001:db8::/32 est la plage réservée à la documentation (RFC 3849)."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:13,
text:"Quel protocole résout automatiquement une adresse IP en adresse MAC sur un réseau local Ethernet ?",
code:null,
opts:["RARP","DNS","ARP","ICMP"],
ok:2,
fb:"ARP (Address Resolution Protocol) permet à un hôte de trouver l'adresse MAC associée à une adresse IP sur le même réseau local. Il envoie un broadcast ARP Request ; le propriétaire de l'IP répond avec un ARP Reply unicast. En IPv6, ARP est remplacé par NDP (Neighbor Discovery Protocol)."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:14,
text:"Qu'est-ce que la virtualisation de réseau VRF (Virtual Routing and Forwarding) ?",
code:null,
opts:[
  "Une technologie de chiffrement du trafic entre routeurs virtuels.",
  "Une technique permettant de créer plusieurs tables de routage indépendantes sur un même routeur physique.",
  "Un protocole de routage dynamique pour les environnements virtualisés.",
  "L'équivalent réseau des VLANs, mais pour les couches 3 et supérieures uniquement."
],
ok:1,
fb:"VRF segmente un routeur physique en plusieurs routeurs virtuels, chacun avec sa propre table de routage, ses propres interfaces et son propre espace d'adressage — comme les VLANs pour la couche 3. Largement utilisé par les FAI pour le MPLS VPN et en entreprise pour isoler des flux (production vs. management)."
},
{d:"Domaine 1 — Network Fundamentals",dw:"20%",di:0,n:15,
text:"Un administrateur constate des erreurs de collision sur une interface. Quelle en est la cause la plus probable ?",
code:"SW1# show interfaces Fa0/1\n  Full-duplex, 100Mb/s\n  Input errors: 0, CRC: 0\n  Output errors: 45, collisions: 312",
opts:[
  "La fibre est endommagée et doit être remplacée.",
  "Il y a un mismatch duplex : l'un des équipements est en half-duplex tandis que l'autre est en full-duplex.",
  "Le VLAN configuré sur ce port est incorrect.",
  "Le port fonctionne à une vitesse trop élevée pour le câble utilisé."
],
ok:1,
fb:"Les collisions sur un port full-duplex sont un indicateur classique de mismatch duplex. En full-duplex, les collisions ne devraient pas exister. Si l'équipement distant est en half-duplex (auto-négociation mal configurée), on obtient des late collisions et des erreurs de CRC. Solution : configurer duplex et speed manuellement des deux côtés."
},

// ═══════════════════════════════════════════════════
// DOMAINE 2 — Network Access (20%) — 15 questions
// ═══════════════════════════════════════════════════
{d:"Domaine 2 — Network Access",dw:"20%",di:1,n:16,
text:"Quelle commande configure le port Fa0/1 d'un switch en port trunk 802.1Q ?",
code:null,
opts:[
  "SW(config-if)# switchport mode trunk",
  "SW(config-if)# switchport trunk encapsulation dot1q\nSW(config-if)# switchport mode trunk",
  "SW(config-if)# trunk mode on",
  "SW(config-if)# vlan trunk enable"
],
ok:1,

{d:"Domaine 3 — IP Connectivity",dw:"25%",di:2,n:43,

{d:"Domaine 3 — IP Connectivity",dw:"25%",di:2,n:44,

{d:"Domaine 3 — IP Connectivity",dw:"25%",di:2,n:46,

{d:"Domaine 3 — IP Connectivity",dw:"25%",di:2,n:48,

{d:"Domaine 4 — IP Services",dw:"10%",di:3,n:50,
text:"Quelle est la différence entre NAT statique et NAT dynamique avec pool ?",
code:null,
opts:[
  "NAT statique est plus sécurisé car il chiffre les adresses ; NAT dynamique ne chiffre pas.",
  "NAT statique mappe une IP privée à une IP publique fixe de façon permanente ; NAT dynamique assigne temporairement une IP publique depuis un pool.",

},
{d:"Domaine 4 — IP Services",dw:"10%",di:3,n:51,
text:"Quelle est la différence entre SNMP v2c et SNMPv3 ?",

},
{d:"Domaine 4 — IP Services",dw:"10%",di:3,n:52,

{d:"Domaine 4 — IP Services",dw:"10%",di:3,n:54,

},
{d:"Domaine 4 — IP Services",dw:"10%",di:3,n:55,
text:"Qu'est-ce que QoS DSCP et pourquoi est-il important dans les réseaux modernes ?",
code:null,

  "DSCP (Differentiated Services Code Point) est un champ de l'en-tête IP qui marque les paquets pour prioriser certains types de trafic (voix, vidéo) sur les liens saturés.",
  "DSCP est un protocole de chiffrement QoS utilisé dans les réseaux MPLS.",
  "DSCP remplace le champ TTL dans l'en-tête IPv6 pour la gestion de la qualité de service.",
  "DSCP est uniquement applicable au trafic multicast."
],
ok:0,

},

],

fb:"ACLs standard (1-99, 1300-1999) : filtrent uniquement l'IP source → placer au plus près de la destination. ACLs étendues (100-199, 2000-2699) : filtrent IP source + destination + protocole (TCP/UDP/ICMP) + ports → placer au plus près de la source. Règle : 'Standard = Source, Extended = Everything'. Les ACLs nommées offrent les mêmes fonctionnalités avec plus de lisibilité."
},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:57,

opts:[

  "HTTP (80) et HTTPS (443) depuis 192.168.1.0/24 vers n'importe quelle destination sont autorisés ; tout autre trafic est bloqué et journalisé.",

],
ok:1,

},

},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:59,
text:"Quelle est la différence entre TACACS+ et RADIUS pour l'authentification des équipements réseau ?",
code:null,
opts:[
  "TACACS+ est standard ouvert ; RADIUS est propriétaire Cisco.",
  "TACACS+ sépare authentification, autorisation et comptabilité (AAA) et chiffre tout le payload ; RADIUS combine auth+autor et chiffre uniquement le mot de passe.",
  "RADIUS utilise TCP port 49 ; TACACS+ utilise UDP ports 1812/1813.",
  "TACACS+ est utilisé pour les utilisateurs finaux ; RADIUS pour les administrateurs réseau."
],
ok:1,
fb:"TACACS+ (Cisco, TCP 49) : chiffre l'intégralité du paquet, sépare strictement les fonctions AAA (granularité maximale pour la gestion réseau). RADIUS (standard RFC, UDP 1812/1813) : chiffre uniquement le mot de passe, combine authentification et autorisation dans un seul échange — préféré pour l'accès utilisateur (Wi-Fi 802.1X, VPN). En entreprise, Cisco ISE implémente les deux."
},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:60,
text:"Qu'est-ce que Dynamic ARP Inspection (DAI) et quel type d'attaque prévient-il ?",
code:null,
opts:[
  "DAI inspecte et chiffre dynamiquement les messages ARP pour éviter leur interception.",
  "DAI valide les messages ARP en les comparant à la table de liaisons DHCP Snooping, prévenant les attaques ARP spoofing / ARP poisoning.",
  "DAI remplace ARP par NDP pour améliorer la sécurité des communications IPv4.",
  "DAI bloque tous les messages ARP sur les ports untrusted pour forcer l'utilisation d'ARP statique."
],
ok:1,
fb:"ARP spoofing permet à un attaquant d'empoisonner le cache ARP des victimes pour intercepter leur trafic (MitM). DAI utilise la table DHCP Snooping comme référence : si une réponse ARP (IP=10.0.0.5, MAC=aa:bb:cc) ne correspond pas à un bail DHCP connu, elle est droppée. Prérequis : DHCP Snooping doit être activé avant DAI."
},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:61,
text:"Quel protocole de sécurité Wi-Fi est recommandé pour les déploiements entreprise actuels ?",
code:null,
opts:["WEP (Wired Equivalent Privacy)","WPA (Wi-Fi Protected Access) avec TKIP","WPA2-Enterprise avec 802.1X et AES-CCMP","WPA2-Personal avec PSK partagé pour tous les utilisateurs"],
ok:2,
fb:"WEP est cassable en quelques minutes. WPA/TKIP a des vulnérabilités connues. WPA2-Enterprise avec 802.1X authentifie chaque utilisateur individuellement via un serveur RADIUS, génère des clés de session uniques (CCMP/AES) et offre la révocation individuelle d'accès. WPA2-PSK (clé partagée) est acceptable pour les petits réseaux mais problématique en entreprise car changer la clé requiert de reconfigurer tous les clients. WPA3 est la norme la plus récente."
},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:62,
text:"Quelle est la différence entre un VPN IPSec site-à-site et un VPN IPSec d'accès à distance ?",

  "Un VPN site-à-site utilise SSL/TLS ; un VPN d'accès à distance utilise IPSec.",
  "Un VPN site-à-site est limité à 10 connexions simultanées."
],
ok:1,
fb:"VPN site-à-site : tunnel permanent entre deux routeurs/firewalls (ex. siège et agence) — transparent pour les utilisateurs. VPN d'accès à distance (Remote Access) : connexion à la demande d'un client (Cisco AnyConnect, etc.) vers un concentrateur VPN — authentification individuelle. IPSec peut être utilisé pour les deux ; SSL/TLS VPN est souvent préféré pour le remote access (pas de client spécifique, fonctionne derrière NAT)."
},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:63,
text:"Qu'est-ce qu'une attaque par VLAN hopping et comment la prévenir ?",
code:null,
opts:[
  "Une attaque qui exploite les failles de STP pour devenir root bridge et intercepter le trafic.",
  "Une attaque qui permet à un attaquant d'envoyer du trafic dans un VLAN auquel il ne devrait pas avoir accès, en exploitant le mode trunk dynamique ou le native VLAN.",

  "Une attaque qui exploite les vulnérabilités DHCP pour changer le VLAN d'un hôte."
],
ok:1,
fb:"Le VLAN hopping exploite : 1) le switch spoofing (l'attaquant négocie un trunk DTP avec le switch) ou 2) le double tagging (exploite le native VLAN pour envoyer vers un autre VLAN). Préventions : désactiver DTP ('switchport nonegotiate'), changer le native VLAN vers un VLAN dédié non utilisé, utiliser 'switchport mode access' sur tous les ports utilisateurs."
},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:64,
text:"Quelle commande Cisco configure un mot de passe chiffré pour l'accès enable ?",
code:null,
opts:[

  "R(config)# service password-encryption",

],
ok:1,
fb:"'enable secret' utilise MD5 (type 5) ou SHA-256 (type 9) pour hacher le mot de passe — il n'apparaît jamais en clair dans la config. 'enable password' stocke le mot de passe en clair ou avec un chiffrement faible (type 7, réversible). 'service password-encryption' chiffre les mots de passe en type 7 mais c'est facilement déchiffrable — à combiner avec 'enable secret'. Toujours préférer 'enable secret'."
},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:65,
text:"Qu'est-ce que AAA (Authentication, Authorization, Accounting) dans le contexte réseau ?",
code:null,
opts:[

},
{d:"Domaine 5 — Security Fundamentals",dw:"15%",di:4,n:66,
text:"Quelle affirmation sur les ACLs IPv4 Cisco est correcte ?",
code:null,
opts:[
  "Une ACL peut être appliquée plusieurs fois en entrée sur la même interface.",
  "Les règles ACL sont évaluées dans l'ordre ; la première correspondance arrête l'évaluation.",
  "Une ACL appliquée en sortie (out) filtre le trafic avant qu'il entre dans l'interface.",
  "Il est possible d'appliquer deux ACLs du même type (ex. deux ACLs 'in') sur la même interface."
],
ok:1,
fb:"Les ACLs Cisco utilisent le principe 'first match' : dès qu'une règle correspond, elle est appliquée et l'évaluation s'arrête. C'est pourquoi l'ordre des règles est critique — mettre les règles les plus spécifiques en premier. Une seule ACL par interface par direction (in ou out). Une ACL 'in' filtre le trafic à son entrée dans le routeur ; une ACL 'out' filtre avant qu'il sorte."
},

{d:"Domaine 6 — Automation & Programmability",dw:"10%",di:5,n:68,

const DNAMES = [
  "Network Fundamentals","Network Access","IP Connectivity",
  "IP Services","Security Fundamentals","Automation & Programmability"
];
const DTOTALS = [18,17,18,9,13,7];
const LETTERS = ['A','B','C','D'];

let S = {screen:'intro',cur:0,score:0,ans:false,ds:[0,0,0,0,0,0]};

function pct(s,t){return t===0?0:Math.round(s/t*100);}

function uh(){
  const hs=document.getElementById('header-score');
  const sub=document.getElementById('header-sub');
  if(S.screen==='question'){
    hs.style.display='block';
    hs.textContent=S.score+' / '+S.cur+' ok';
    sub.textContent='Q'+Q[S.cur].n+'/'+Q.length+' — '+Q[S.cur].d;
  } else if(S.screen==='result'){
    hs.style.display='none';
    sub.textContent='Résultats finaux';
  } else {
    hs.style.display='none';
    sub.textContent='QCM de positionnement — CYBERSTRUCT';
  }
}

function intro(){
  S.screen='intro'; uh();
  document.getElementById('app').innerHTML=`
  <div class="intro-card card-anim">
    <div class="intro-title">CCNA 200-301 v1.1</div>
    <div class="intro-sub">72 questions couvrant les 6 domaines officiels Cisco, pondérées selon le blueprint de l'examen réel. Mix théorie + scénarios CLI pour M2 Infra/Réseau. Seuil de passage estimé : 825/1000 (~80%).</div>
    <div class="intro-stats">
      <div class="intro-stat"><div class="intro-stat-val">82</div><div class="intro-stat-label">questions</div></div>
      <div class="intro-stat"><div class="intro-stat-val">~80%</div><div class="intro-stat-label">seuil estimé</div></div>
      <div class="intro-stat"><div class="intro-stat-val">~70 min</div><div class="intro-stat-label">durée estimée</div></div>
      <div class="intro-stat"><div class="intro-stat-val">6</div><div class="intro-stat-label">domaines officiels</div></div>
    </div>
    <div class="intro-blocs">
      <div class="intro-blocs-title">Domaines Cisco 200-301 v1.1</div>
      ${[
        ["1","Network Fundamentals (OSI, subnetting, IPv6, PoE, virtualisation...)","18 q","20%"],
        ["2","Network Access (VLANs, STP, EtherChannel, Wi-Fi, Root/Loop Guard...)","17 q","20%"],
        ["3","IP Connectivity (routage, OSPF, FHRP, SLAAC, static routes...)","18 q","25%"],
        ["4","IP Services (NAT/PAT, NTP, DHCP relay, SNMP, Syslog, SSH, QoS...)","9 q","10%"],
        ["5","Security Fundamentals (ACL, VPN, AAA, TACACS+, passwords, exploits...)","13 q","15%"],
        ["6","Automation & Programmability (SDN, REST, Ansible, JSON, NETCONF, Fabric...)","7 q","10%"]
      ].map(([n,name,q,w])=>`
      <div class="intro-bloc-item">
        <div class="intro-bloc-num">${n}</div>
        <span>${name}</span>
        <div class="intro-bloc-meta">
          <span class="intro-bloc-q">${q}</span>
          <span class="intro-bloc-w">${w}</span>
        </div>
      </div>`).join('')}
    </div>
    <button class="btn-start" onclick="start()">Commencer le QCM</button>
  </div>`;
}

function start(){
  S={screen:'question',cur:0,score:0,ans:false,ds:[0,0,0,0,0,0]};
  render();
}

function render(){
  S.screen='question'; S.ans=false; uh();
  const q=Q[S.cur];
  const prog=Math.round(S.cur/Q.length*100);
  document.getElementById('app').innerHTML=`
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${prog}%"></div></div>
    <div class="progress-labels"><span>Q${q.n} / ${Q.length}</span><span>${prog}%</span></div>
  </div>
  <div class="card card-anim">
    <div class="bloc-badge">${q.d} <span class="bloc-weight">${q.dw}</span></div>
    <div class="question-text">${q.text}</div>
    ${q.code?`<div class="code-block">${q.code}</div>`:''}
    <div class="options" id="opts">
      ${q.opts.map((o,i)=>`
      <button class="option-btn" onclick="ans(${i})">
        <span class="option-letter">${LETTERS[i]}</span>
        <span>${o}</span>
      </button>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="nav-row" id="nav" style="display:none">
      <button class="btn-next" onclick="next()">${S.cur<Q.length-1?'Question suivante →':'Voir mes résultats →'}</button>
    </div>
  </div>`;
}

function ans(i){
  if(S.ans)return;
  S.ans=true;
  const q=Q[S.cur];
  const ok=i===q.ok;
  if(ok){S.score++;S.ds[q.di]++;}
  document.querySelectorAll('.option-btn').forEach((b,j)=>{
    b.disabled=true;
    if(j===i&&ok)b.classList.add('correct');
    if(j===i&&!ok)b.classList.add('wrong');
    if(j===q.ok&&!ok)b.classList.add('reveal-correct');
  });
  document.getElementById('fb').innerHTML=`
  <div class="feedback-box ${ok?'correct':'wrong'}">
    <span class="feedback-label">${ok?'✓ Bonne réponse':'✗ Mauvaise réponse'}</span>
    ${q.fb}
  </div>`;
  document.getElementById('nav').style.display='flex';
  uh();
}

function next(){
  S.cur++;
  if(S.cur>=Q.length) result();
  else render();
}

function result(){
  S.screen='result'; uh();
  const p=pct(S.score,Q.length);
  let vt,vs;
  if(p>=80){vt='Excellent — niveau suffisant pour passer l\'examen CCNA !';vs='background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);';}
  else if(p>=65){vt='Bon niveau — quelques lacunes à combler avant l\'examen.';vs='background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text);';}
  else{vt='En dessous du seuil — reprendre les domaines en difficulté.';vs='background:var(--error-bg);border-color:var(--error-border);color:var(--error-text);';}
  const bc=DNAMES.map((n,i)=>`
  <div class="bloc-card">
    <div class="bloc-card-name">${n}</div>
    <div class="bloc-card-score">${S.ds[i]}/${DTOTALS[i]}<span class="bloc-card-pct">(${pct(S.ds[i],DTOTALS[i])}%)</span></div>
  </div>`).join('');
  document.getElementById('app').innerHTML=`
  <div class="result-card card-anim">
    <div class="result-pct">${p}%</div>
    <div class="result-fraction">${S.score} / ${Q.length} bonnes réponses</div>
    <div class="result-verdict" style="${vs}">${vt}</div>
    <div class="bloc-grid">${bc}</div>
    <div class="threshold-note">Seuil estimé CCNA : ~80% (825/1000 score pondéré Cisco) — soit 66/82 dans ce QCM</div>
    <button class="btn-restart" onclick="restart()">Recommencer le QCM</button>
  </div>`;
}
