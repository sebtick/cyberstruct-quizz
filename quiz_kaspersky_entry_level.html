<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM — Kaspersky Cybersecurity Entry Level | CYBERSTRUCT</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --surface2: #f2f1ee;
    --text: #1a1a18;
    --text-muted: #6b6a66;
    --text-hint: #9e9d99;
    --border: rgba(0,0,0,0.10);
    --border-med: rgba(0,0,0,0.18);
    --accent: #185FA5;
    --accent-bg: #E6F1FB;
    --accent-text: #0C447C;
    --success-bg: #EAF3DE;
    --success-border: #639922;
    --success-text: #27500A;
    --error-bg: #FCEBEB;
    --error-border: #E24B4A;
    --error-text: #A32D2D;
    --warn-bg: #FAEEDA;
    --warn-border: #BA7517;
    --warn-text: #854F0B;
    --radius: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --surface: #252523;
      --surface2: #2e2e2b;
      --text: #f0ede8;
      --text-muted: #a09f9a;
      --text-hint: #6b6a66;
      --border: rgba(255,255,255,0.10);
      --border-med: rgba(255,255,255,0.18);
      --accent: #4A90D9;
      --accent-bg: #0C2840;
      --accent-text: #85B7EB;
      --success-bg: #0e2206;
      --success-border: #3B6D11;
      --success-text: #C0DD97;
      --error-bg: #2a0a0a;
      --error-border: #A32D2D;
      --error-text: #F09595;
      --warn-bg: #2a1a04;
      --warn-border: #854F0B;
      --warn-text: #FAC775;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ─── Header ─── */
  .header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-logo {
    width: 34px; height: 34px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-logo svg { width: 18px; height: 18px; fill: white; }
  .header-info { flex: 1; }
  .header-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .header-sub { font-size: 12px; color: var(--text-muted); }
  .header-score {
    font-size: 13px; font-weight: 500;
    color: var(--accent-text);
    background: var(--accent-bg);
    padding: 4px 12px;
    border-radius: 20px;
  }

  /* ─── Progress ─── */
  .progress-wrap { padding: 0 24px; margin-top: 20px; }
  .progress-track {
    height: 3px; background: var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-hint);
    margin-top: 5px;
  }

  /* ─── Main card ─── */
  .main { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }

  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  .bloc-badge {
    display: inline-block;
    font-size: 11px; font-weight: 500;
    background: var(--accent-bg);
    color: var(--accent-text);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
    letter-spacing: 0.01em;
  }

  .question-num {
    font-size: 11px; color: var(--text-hint);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .question-text {
    font-size: 16px; font-weight: 500;
    color: var(--text);
    line-height: 1.55;
    margin-bottom: 20px;
  }

  /* ─── Options ─── */
  .options { display: flex; flex-direction: column; gap: 9px; }

  .option-btn {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 16px;
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm);
    background: var(--surface);
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
    width: 100%;
    font-family: inherit;
  }
  .option-btn:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    transform: translateX(2px);
  }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    font-size: 11px; font-weight: 500;
    min-width: 22px; height: 22px;
    background: var(--surface2);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
  }
  .option-btn:hover:not(:disabled) .option-letter {
    background: var(--accent-bg);
    color: var(--accent-text);
  }

  .option-btn.correct {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: var(--success-text);
  }
  .option-btn.correct .option-letter {
    background: var(--success-border);
    color: white;
  }
  .option-btn.wrong {
    background: var(--error-bg);
    border-color: var(--error-border);
    color: var(--error-text);
  }
  .option-btn.wrong .option-letter {
    background: var(--error-border);
    color: white;
  }
  .option-btn.reveal-correct {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: var(--success-text);
    opacity: 0.65;
  }

  /* ─── Feedback ─── */
  .feedback-box {
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    line-height: 1.65;
    border: 0.5px solid;
    animation: fadeIn 0.2s ease;
  }
  .feedback-box.correct {
    background: var(--success-bg);
    border-color: var(--success-border);
    color: var(--success-text);
  }
  .feedback-box.wrong {
    background: var(--error-bg);
    border-color: var(--error-border);
    color: var(--error-text);
  }
  .feedback-label { font-weight: 500; display: block; margin-bottom: 4px; }

  .justif-box {
    margin-top: 10px;
    padding: 10px 14px;
    border-left: 2px solid var(--border-med);
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.65;
    background: var(--surface2);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    animation: fadeIn 0.25s ease;
  }
  .justif-label { font-weight: 500; font-style: normal; color: var(--text-hint); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 3px; }

  /* ─── Nav ─── */
  .nav-row {
    display: flex; justify-content: flex-end;
    margin-top: 18px;
  }
  .btn-next {
    padding: 10px 22px;
    font-size: 14px; font-weight: 500;
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s;
  }
  .btn-next:hover { background: var(--surface2); }

  /* ─── Results ─── */
  .result-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
  }
  .result-pct {
    font-size: 64px; font-weight: 500;
    color: var(--text);
    line-height: 1;
    margin-bottom: 6px;
  }
  .result-fraction {
    font-size: 15px; color: var(--text-muted);
    margin-bottom: 20px;
  }
  .result-verdict {
    display: inline-block;
    font-size: 14px; font-weight: 500;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    margin-bottom: 28px;
    border: 0.5px solid;
  }

  .bloc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
    text-align: left;
  }
  .bloc-card {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .bloc-card-name { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; line-height: 1.4; }
  .bloc-card-score { font-size: 22px; font-weight: 500; color: var(--text); }
  .bloc-card-pct { font-size: 12px; color: var(--text-hint); margin-left: 4px; }

  .threshold-note {
    font-size: 12px; color: var(--text-hint);
    margin-bottom: 20px;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
  }

  .btn-restart {
    padding: 10px 28px;
    font-size: 14px; font-weight: 500;
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s;
  }
  .btn-restart:hover { background: var(--surface2); }

  /* ─── Intro screen ─── */
  .intro-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
  }
  .intro-title { font-size: 22px; font-weight: 500; margin-bottom: 8px; }
  .intro-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.6; }
  .intro-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .intro-stat {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .intro-stat-val { font-size: 20px; font-weight: 500; }
  .intro-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .intro-blocs { margin-bottom: 24px; }
  .intro-blocs-title { font-size: 12px; font-weight: 500; color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  .intro-bloc-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; padding: 7px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .intro-bloc-item:last-child { border-bottom: none; }
  .intro-bloc-num {
    width: 22px; height: 22px;
    background: var(--accent-bg); color: var(--accent-text);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; flex-shrink: 0;
  }
  .intro-bloc-q { font-size: 12px; color: var(--text-hint); margin-left: auto; }
  .btn-start {
    width: 100%;
    padding: 12px;
    font-size: 15px; font-weight: 500;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.12s;
  }
  .btn-start:hover { opacity: 0.88; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .card-anim { animation: fadeIn 0.2s ease; }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6L12 2zm0 2.18l6 2.82v5c0 4.25-2.8 8.18-6 9.3-3.2-1.12-6-5.05-6-9.3V7l6-2.82z"/></svg>
  </div>
  <div class="header-info">
    <div class="header-title">Kaspersky Cybersecurity Entry Level</div>
    <div class="header-sub" id="header-sub">QCM de positionnement — CYBERSTRUCT</div>
  </div>
  <div class="header-score" id="header-score" style="display:none"></div>
</div>

<div class="main" id="app"></div>

<script>
const QUESTIONS = [
  {
    bloc: "Bloc 1 — Concepts de base",
    blocIdx: 0,
    num: 1,
    text: "Quelle est la principale différence entre la confidentialité et l'intégrité en cybersécurité ?",
    options: [
      "La confidentialité protège les données contre la perte, l'intégrité protège contre le vol.",
      "La confidentialité garantit que seules les personnes autorisées accèdent aux données ; l'intégrité garantit que les données n'ont pas été modifiées de façon non autorisée.",
      "La confidentialité concerne la disponibilité des systèmes, l'intégrité concerne leur performance.",
      "Il n'y a pas de différence, les deux termes désignent la même propriété."
    ],
    correct: 1,
    feedback: "La confidentialité (C), l'intégrité (I) et la disponibilité (A) forment la triade CIA, pilier fondamental de la sécurité. Confidentialité = accès réservé aux personnes autorisées. Intégrité = données non altérées. Disponibilité = systèmes accessibles quand nécessaire.",
    justif: "La triade CIA est le concept central des premières leçons du cours Kaspersky. Distinguer ces trois propriétés est systématiquement testé dans l'évaluation finale."
  },
  {
    bloc: "Bloc 1 — Concepts de base",
    blocIdx: 0,
    num: 2,
    text: "Qu'est-ce qu'une vulnérabilité en sécurité informatique ?",
    options: [
      "Un logiciel malveillant conçu pour endommager un système.",
      "Une faiblesse dans un système, une application ou un processus qui peut être exploitée par un attaquant.",
      "Une attaque active en cours contre un réseau.",
      "Un outil utilisé par les équipes de sécurité pour détecter des intrusions."
    ],
    correct: 1,
    feedback: "Une vulnérabilité est une faiblesse (faille de code, mauvaise configuration, erreur humaine). Une menace est ce qui pourrait exploiter cette faiblesse. Un risque est la combinaison de la probabilité et de l'impact. Ne pas confondre ces trois notions — distinction clé dans le cours.",
    justif: "La distinction vulnérabilité / menace / risque est l'une des plus fréquemment testées dans les certifications Kaspersky Entry Level. Beaucoup d'étudiants confondent ces termes."
  },
  {
    bloc: "Bloc 1 — Concepts de base",
    blocIdx: 0,
    num: 3,
    text: "Lequel des exemples suivants illustre correctement une authentification multi-facteurs (MFA) ?",
    options: [
      "Saisir un mot de passe long et complexe de 20 caractères.",
      "Utiliser deux mots de passe différents pour le même compte.",
      "Saisir un mot de passe (ce que je sais) puis confirmer via une notification sur son téléphone (ce que je possède).",
      "Se connecter depuis un réseau d'entreprise de confiance uniquement."
    ],
    correct: 2,
    feedback: "Le MFA combine au minimum deux facteurs de natures différentes : quelque chose que je sais (mot de passe, PIN), quelque chose que je possède (téléphone, token), quelque chose que je suis (empreinte, visage). Deux mots de passe restent dans la même catégorie et ne constituent pas du MFA.",
    justif: "Le MFA est abordé dans les concepts de base et revient dans les bonnes pratiques. C'est une notion très concrète, directement applicable, que les étudiants rencontreront dans leur vie professionnelle dès le premier jour."
  },
  {
    bloc: "Bloc 2 — Outils des attaquants",
    blocIdx: 1,
    num: 4,
    text: "Quel type de malware chiffre les fichiers de la victime et exige un paiement pour les déchiffrer ?",
    options: [
      "Un spyware",
      "Un ransomware",
      "Un adware",
      "Un rootkit"
    ],
    correct: 1,
    feedback: "Le ransomware chiffre les données et demande une rançon (souvent en cryptomonnaie) pour la clé de déchiffrement. Le spyware surveille discrètement. L'adware affiche des publicités intrusives. Le rootkit donne un accès privilégié caché au système. Chaque type a un mode opératoire distinct.",
    justif: "Le ransomware est la menace la plus médiatisée et la plus fréquente en entreprise. Identifier et différencier les types de malwares est un objectif d'évaluation explicite dans le cours Kaspersky."
  },
  {
    bloc: "Bloc 2 — Outils des attaquants",
    blocIdx: 1,
    num: 5,
    text: "Qu'est-ce qu'une attaque de phishing ?",
    options: [
      "Une attaque qui exploite une vulnérabilité technique dans le système d'exploitation.",
      "Une tentative de manipulation psychologique pour pousser une victime à révéler des informations sensibles ou cliquer sur un lien malveillant.",
      "Un logiciel qui s'installe en arrière-plan pour espionner les activités d'un utilisateur.",
      "Une attaque qui surcharge un serveur pour le rendre indisponible."
    ],
    correct: 1,
    feedback: "Le phishing exploite l'ingénierie sociale (manipulation humaine) et non une faille technique. C'est la cybermenace la plus répandue. Le spear phishing est une variante ciblée. Selon le rapport Kaspersky cité dans le cours, l'erreur humaine reste la principale cause d'incidents en entreprise.",
    justif: "Le phishing est l'attaque numéro un abordée dans le bloc types d'attaques. Il est directement lié à la mission SOC (détection, alertes) et à la réalité du terrain que les étudiants rencontreront."
  },
  {
    bloc: "Bloc 2 — Outils des attaquants",
    blocIdx: 1,
    num: 6,
    text: "Qu'est-ce qu'une attaque par déni de service distribué (DDoS) ?",
    options: [
      "Un attaquant qui tente de deviner le mot de passe d'un compte par essais successifs.",
      "Un logiciel malveillant qui se propage de machine en machine automatiquement.",
      "Une attaque qui utilise de nombreuses machines compromises (botnet) pour saturer un service et le rendre indisponible.",
      "Une technique pour intercepter les communications sur un réseau non chiffré."
    ],
    correct: 2,
    feedback: "Dans une attaque DDoS, l'attaquant contrôle un botnet (réseau de machines infectées) et les dirige simultanément vers la cible pour épuiser ses ressources. Le DoS classique n'utilise qu'une seule source. Le DDoS est beaucoup plus difficile à mitiger car le trafic provient de milliers d'adresses IP différentes.",
    justif: "Le DDoS illustre parfaitement la mise en danger de la disponibilité (le A de la triade CIA). Il introduit aussi la notion de botnet, abordée dans le cours. Questions sur les types d'attaques réseaux sont récurrentes dans les examens Kaspersky."
  },
  {
    bloc: "Bloc 3 — Domaines de la cybersécurité",
    blocIdx: 2,
    num: 7,
    text: "Quel est le rôle principal d'un SOC (Security Operations Center) ?",
    options: [
      "Développer de nouveaux logiciels et outils de sécurité.",
      "Gérer les serveurs et l'infrastructure réseau de l'entreprise.",
      "Surveiller en continu les systèmes, détecter les incidents de sécurité et y répondre.",
      "Former les employés aux bonnes pratiques de cybersécurité."
    ],
    correct: 2,
    feedback: "Le SOC est la tour de contrôle opérationnelle de la cybersécurité. Ses missions : surveillance 24/7, détection d'anomalies via SIEM, réponse aux incidents, et reporting. Il n'est pas responsable de l'infrastructure ou du développement logiciel — ce sont d'autres équipes IT distinctes.",
    justif: "Question stratégique pour le track Mini-SOC. Comprendre ce qu'est un SOC et ce qu'il n'est pas est fondamental. Le cours Kaspersky décrit explicitement les métiers cyber, dont l'analyste SOC, dans son module carrières."
  },
  {
    bloc: "Bloc 3 — Domaines de la cybersécurité",
    blocIdx: 2,
    num: 8,
    text: "Qu'est-ce que la cryptographie asymétrique ?",
    options: [
      "Un chiffrement qui utilise la même clé pour chiffrer et déchiffrer les données.",
      "Un chiffrement qui utilise une paire de clés : une clé publique pour chiffrer et une clé privée pour déchiffrer.",
      "Un système de chiffrement uniquement utilisé pour stocker les mots de passe.",
      "Une technique pour compresser les données avant de les transmettre."
    ],
    correct: 1,
    feedback: "La cryptographie asymétrique (ex. RSA, ECC) utilise deux clés mathématiquement liées. La clé publique est partageable — elle sert à chiffrer. La clé privée est secrète — elle seule peut déchiffrer. C'est le fondement du HTTPS, des certificats numériques et de la signature électronique.",
    justif: "La cryptographie est un domaine de la cybersécurité à part entière, abordé dans le bloc 3. La distinction symétrique/asymétrique est une notion testée dans l'évaluation finale et la base pour comprendre HTTPS et PKI."
  },
  {
    bloc: "Bloc 3 — Domaines de la cybersécurité",
    blocIdx: 2,
    num: 9,
    text: "Que désignent les \"Indicators of Compromise\" (IoC) en cybersécurité ?",
    options: [
      "Les règles de pare-feu permettant de bloquer un attaquant identifié.",
      "Des artefacts observables (adresses IP, hashes de fichiers, domaines malveillants) indiquant qu'un système a probablement été compromis.",
      "Les procédures légales à suivre après un incident de sécurité.",
      "Les métriques de performance d'un système surveillé par le SOC."
    ],
    correct: 1,
    feedback: "Les IoC sont des preuves numériques laissées par une attaque : adresse IP malveillante, hash de fichier malware, domaine de command & control. Ils permettent aux analystes SOC de confirmer une compromission et d'identifier d'autres systèmes affectés. À ne pas confondre avec les IoA (comportementaux).",
    justif: "Les IoC sont explicitement mentionnés dans le cours Kaspersky en lien avec les pratiques SOC et la threat intelligence. C'est un terme fondamental que tout étudiant du track Mini-SOC doit maîtriser."
  },
  {
    bloc: "Bloc 3 — Domaines de la cybersécurité",
    blocIdx: 2,
    num: 10,
    text: "Qu'est-ce que le principe du moindre privilège (Least Privilege) ?",
    options: [
      "Ne donner aux utilisateurs et systèmes que les droits strictement nécessaires à l'exercice de leurs fonctions.",
      "Accorder temporairement des droits élevés à tous les utilisateurs en situation d'urgence.",
      "Limiter l'accès à internet pour réduire la surface d'attaque.",
      "Interdire l'utilisation de comptes administrateurs sur tous les postes du réseau."
    ],
    correct: 0,
    feedback: "Le principe du moindre privilège est un pilier de la gestion des accès (IAM). Un comptable n'a pas besoin d'accès root sur un serveur de production. Si son compte est compromis, les dégâts restent limités à ses droits. Ce principe réduit drastiquement l'impact d'une intrusion ou d'une erreur humaine.",
    justif: "Principe abordé dans le domaine gestion des accès et identités. C'est l'un des concepts les plus testés car directement applicable en entreprise, et souvent mal compris par les étudiants en début de formation."
  },
  {
    bloc: "Bloc 4 — Futur de la cybersécurité",
    blocIdx: 3,
    num: 11,
    text: "Qu'est-ce que le modèle de sécurité \"Zero Trust\" ?",
    options: [
      "Un modèle où seuls les utilisateurs présents sur le réseau interne de l'entreprise sont considérés fiables.",
      "Un cadre de sécurité qui part du principe qu'aucun utilisateur ni système n'est fiable par défaut, même à l'intérieur du réseau, et impose une vérification continue.",
      "Un système qui bloque tous les accès jusqu'à ce qu'un administrateur les autorise manuellement un par un.",
      "Un modèle réservé aux environnements militaires et gouvernementaux à haute sécurité."
    ],
    correct: 1,
    feedback: "Le Zero Trust abandonne le modèle château-fort (\"tout ce qui est à l'intérieur du périmètre est sûr\"). Sa devise : \"Ne jamais faire confiance, toujours vérifier.\" Chaque accès est authentifié, autorisé et journalisé, qu'il vienne de l'interne ou de l'externe. C'est le modèle de référence pour les environnements cloud et hybrides.",
    justif: "Le Zero Trust est présenté dans le bloc futur de la cybersécurité comme tendance architecturale majeure. Pour des étudiants qui iront travailler dans des SOC modernes, comprendre ce paradigme est essentiel."
  },
  {
    bloc: "Bloc 4 — Futur de la cybersécurité",
    blocIdx: 3,
    num: 12,
    text: "Comment l'intelligence artificielle est-elle principalement utilisée dans les solutions de cybersécurité modernes ?",
    options: [
      "Uniquement pour automatiser la création et la rotation des mots de passe.",
      "Pour détecter des comportements anormaux en analysant de grands volumes d'événements de sécurité en temps réel.",
      "Pour remplacer entièrement les analystes humains dans les SOC et éliminer les faux positifs.",
      "Exclusivement dans le domaine du chiffrement et de la cryptographie."
    ],
    correct: 1,
    feedback: "L'IA/ML est utilisée pour l'analyse comportementale (UEBA), la détection d'anomalies et le tri des alertes dans les SIEM modernes. Elle augmente les capacités humaines mais ne les remplace pas — les décisions complexes restent humaines. Kaspersky intègre l'IA dans ses solutions de threat intelligence.",
    justif: "Clôture logique sur le bloc futur. Cette question déconstruit l'idée reçue que l'IA remplace les humains, fait le lien avec le track IA/DATA de l'incubateur, et est dans la continuité directe du cours Kaspersky qui aborde les tendances technologiques."
  }
];

const BLOC_NAMES = ["Concepts de base", "Outils des attaquants", "Domaines cyber", "Futur de la cybersécurité"];
const BLOC_TOTALS = [3, 3, 4, 2];
const LETTERS = ['A', 'B', 'C', 'D'];

let state = {
  screen: 'intro',
  current: 0,
  score: 0,
  answered: false,
  blocScores: [0, 0, 0, 0]
};

function pct(s, t) { return t === 0 ? 0 : Math.round((s / t) * 100); }

function updateHeader() {
  const hScore = document.getElementById('header-score');
  const hSub = document.getElementById('header-sub');
  if (state.screen === 'question') {
    hScore.style.display = 'block';
    hScore.textContent = state.score + ' / ' + state.current + ' correctes';
    hSub.textContent = 'QCM de positionnement — CYBERSTRUCT';
  } else if (state.screen === 'result') {
    hScore.style.display = 'none';
    hSub.textContent = 'Résultats';
  } else {
    hScore.style.display = 'none';
    hSub.textContent = 'QCM de positionnement — CYBERSTRUCT';
  }
}

function renderIntro() {
  state.screen = 'intro';
  updateHeader();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="intro-card card-anim">
      <div class="intro-title">QCM Kaspersky Cybersecurity Entry Level</div>
      <div class="intro-sub">Ce QCM de positionnement couvre les 4 blocs thématiques du cours officiel Kaspersky. Il te permet d'évaluer ta préparation avant de passer la certification. Chaque question est accompagnée d'une explication détaillée et d'une justification pédagogique.</div>
      <div class="intro-stats">
        <div class="intro-stat">
          <div class="intro-stat-val">12</div>
          <div class="intro-stat-label">questions</div>
        </div>
        <div class="intro-stat">
          <div class="intro-stat-val">70%</div>
          <div class="intro-stat-label">seuil de passage (Kaspersky)</div>
        </div>
        <div class="intro-stat">
          <div class="intro-stat-val">~15 min</div>
          <div class="intro-stat-label">durée estimée</div>
        </div>
      </div>
      <div class="intro-blocs">
        <div class="intro-blocs-title">Contenu du QCM</div>
        <div class="intro-bloc-item">
          <div class="intro-bloc-num">1</div>
          <span>Concepts de base de la cybersécurité (triade CIA, MFA, vulnérabilités)</span>
          <span class="intro-bloc-q">3 questions</span>
        </div>
        <div class="intro-bloc-item">
          <div class="intro-bloc-num">2</div>
          <span>Outils des attaquants et types de cyberattaques</span>
          <span class="intro-bloc-q">3 questions</span>
        </div>
        <div class="intro-bloc-item">
          <div class="intro-bloc-num">3</div>
          <span>Domaines de la cybersécurité (SOC, crypto, IAM, IoC)</span>
          <span class="intro-bloc-q">4 questions</span>
        </div>
        <div class="intro-bloc-item">
          <div class="intro-bloc-num">4</div>
          <span>Futur de la cybersécurité (Zero Trust, IA)</span>
          <span class="intro-bloc-q">2 questions</span>
        </div>
      </div>
      <button class="btn-start" onclick="startQuiz()">Commencer le QCM</button>
    </div>
  `;
}

function startQuiz() {
  state = { screen: 'question', current: 0, score: 0, answered: false, blocScores: [0,0,0,0] };
  renderQuestion();
}

function renderQuestion() {
  state.screen = 'question';
  state.answered = false;
  updateHeader();
  const q = QUESTIONS[state.current];
  const progressPct = Math.round((state.current / QUESTIONS.length) * 100);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="pbar" style="width:${progressPct}%"></div></div>
      <div class="progress-labels">
        <span>Question ${q.num} sur ${QUESTIONS.length}</span>
        <span>${progressPct}% complété</span>
      </div>
    </div>
    <div class="card card-anim" style="margin-top:20px">
      <div class="bloc-badge">${q.bloc}</div>
      <div class="question-text">${q.text}</div>
      <div class="options" id="options">
        ${q.options.map((opt, i) => `
          <button class="option-btn" data-idx="${i}" onclick="handleAnswer(${i})">
            <span class="option-letter">${LETTERS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div id="feedback-area"></div>
      <div id="justif-area"></div>
      <div class="nav-row" id="nav-row" style="display:none">
        <button class="btn-next" onclick="nextQuestion()">
          ${state.current < QUESTIONS.length - 1 ? 'Question suivante →' : 'Voir mes résultats →'}
        </button>
      </div>
    </div>
  `;
}

function handleAnswer(idx) {
  if (state.answered) return;
  state.answered = true;
  const q = QUESTIONS[state.current];
  const isCorrect = idx === q.correct;
  if (isCorrect) {
    state.score++;
    state.blocScores[q.blocIdx]++;
  }

  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === idx && isCorrect) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('wrong');
    if (i === q.correct && !isCorrect) btn.classList.add('reveal-correct');
  });

  document.getElementById('feedback-area').innerHTML = `
    <div class="feedback-box ${isCorrect ? 'correct' : 'wrong'}">
      <span class="feedback-label">${isCorrect ? '✓ Bonne réponse' : '✗ Mauvaise réponse'}</span>
      ${q.feedback}
    </div>
  `;

  document.getElementById('justif-area').innerHTML = `
    <div class="justif-box">
      <span class="justif-label">Pourquoi cette question ?</span>
      ${q.justif}
    </div>
  `;

  document.getElementById('nav-row').style.display = 'flex';
  updateHeader();
}

function nextQuestion() {
  state.current++;
  if (state.current >= QUESTIONS.length) {
    renderResult();
  } else {
    renderQuestion();
  }
}

function renderResult() {
  state.screen = 'result';
  updateHeader();
  const p = pct(state.score, QUESTIONS.length);

  let verdictText, verdictStyle;
  if (p >= 80) {
    verdictText = 'Excellent — tu es prêt(e) pour la certification Kaspersky !';
    verdictStyle = `background: var(--success-bg); border-color: var(--success-border); color: var(--success-text);`;
  } else if (p >= 70) {
    verdictText = 'Tu franchis le seuil Kaspersky (70%) — quelques révisions pour consolider.';
    verdictStyle = `background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text);`;
  } else {
    verdictText = 'En dessous du seuil (70%) — reprendre les modules du cours Kaspersky.';
    verdictStyle = `background: var(--error-bg); border-color: var(--error-border); color: var(--error-text);`;
  }

  const blocCards = BLOC_NAMES.map((name, i) => {
    const bp = pct(state.blocScores[i], BLOC_TOTALS[i]);
    return `
      <div class="bloc-card">
        <div class="bloc-card-name">${name}</div>
        <div class="bloc-card-score">${state.blocScores[i]}/${BLOC_TOTALS[i]}<span class="bloc-card-pct">(${bp}%)</span></div>
      </div>
    `;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="result-card card-anim">
      <div class="result-pct">${p}%</div>
      <div class="result-fraction">${state.score} bonnes réponses sur ${QUESTIONS.length}</div>
      <div class="result-verdict" style="${verdictStyle}">${verdictText}</div>
      <div class="bloc-grid">${blocCards}</div>
      <div class="threshold-note">Seuil de passage officiel Kaspersky : 70% (≈ 9/12 dans ce QCM)</div>
      <button class="btn-restart" onclick="restart()">Recommencer le QCM</button>
    </div>
  `;
}

function restart() {
  state = { screen: 'intro', current: 0, score: 0, answered: false, blocScores: [0,0,0,0] };
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
